<!-- 2026.11.13 Ver.2.5 選択欄をライトグリーンに調整 -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ジムカーナ練習記録</title>
<style>
/* 2026.11.13 */
/* 2026.11.13 Ver.2.5：選択欄全般を淡いグリーンに統一。メイン表示色は維持 */
:root {
  color-scheme: light;
  --bg: #DDE5ED;
  --panel: #eaf0f5;
  --line: #d7e0e8;
  --text: #243447;
  --sub: #68798b;
  --accent: #2878a8;
  --accent-dark: #1f628b;
  --green: #23845b;
  --green-dark: #1b6b49;
  --gold: #e9b949;
  --gold-text: #80601a;
  --danger: #c65353;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ===== 固定ヘッダー（ページ選択） ===== */
#top {
  flex: none;
  padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
  background: linear-gradient(180deg, #EAF7ED 0%, #E2F1E6 100%);
  border-bottom: 1px solid #D2E6D7;
  box-shadow: 0 2px 8px rgba(35, 55, 75, .05);
}
#topRow { display: flex; gap: 6px; align-items: center; }
#top .btn.sub { background: #F2FAF3; border-color: #D2E6D7; }
#pageSel {
  flex: 1;
  min-width: 0;
  height: 44px;
  padding: 0 8px;
  background: #F2FAF3;
  border: 1px solid #D2E6D7;
  border-radius: 8px;
}
/* 2026.11.13 追加：日付変更ボタン */
#dateBtn { flex: none; padding: 0 10px; }
#datePicker { display: none; }

/* 2026.11.13 Ver.2.2：スマホでも確実に操作できる日付カレンダー */
#calendarOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(20, 28, 40, .55);
  padding: 16px;
  align-items: center;
  justify-content: center;
}
#calendarOverlay.open { display: flex; }
#calendarPanel {
  width: min(100%, 390px);
  background: #EAF7ED;
  color: var(--text);
  border: 1px solid #CFE4D4;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 18px 55px rgba(30, 50, 70, .24);
}
#calendarHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
#calendarMonth { flex: 1; text-align: center; font-size: 18px; font-weight: 700; }
.cal-nav { width: 42px; height: 42px; border: 1px solid #D2E6D7; border-radius: 10px; background: #F5FBF6; font-size: 22px; }
#calendarGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-week { text-align: center; color: var(--sub); font-size: 12px; padding: 4px 0; }
.cal-day {
  min-width: 0; height: 42px; border: 1px solid transparent; border-radius: 10px;
  background: #F1F8F2; color: var(--text); font-size: 15px; position: relative;
  transition: background .15s, transform .15s;
}
.cal-day:active { transform: scale(.96); }
.cal-day.empty { visibility: hidden; }
.cal-day.has-notes { background: #2878a8; color: #fff; font-weight: 700; box-shadow: inset 0 -2px 0 rgba(0,0,0,.10); }
.cal-day.selected { outline: 3px solid #e9b949; outline-offset: 1px; }
.cal-day.today:not(.has-notes) { border-color: var(--green); color: var(--green); font-weight: 700; }
.cal-day .cal-count { position: absolute; right: 3px; top: 1px; font-size: 9px; line-height: 1; opacity: .9; }
#calendarLegend { display: flex; align-items: center; gap: 7px; margin: 12px 0; color: var(--sub); font-size: 12px; }
#calendarLegend .sample { width: 13px; height: 13px; border-radius: 4px; background: #2878a8; }
#calendarActions { display: flex; gap: 8px; margin-top: 12px; }
#calendarActions .btn { flex: 1; }
#calendarPanel .btn.sub { background: #F5FBF6; border-color: #D2E6D7; }
@media (max-width: 380px) {
  #calendarPanel { padding: 12px; }
  #calendarGrid { gap: 3px; }
  .cal-day { height: 39px; }
}
.btn {
  height: 44px;
  padding: 0 14px;
  background: var(--accent);
  border: 1px solid transparent;
  border-radius: 10px;
  color: #fff;
  font-weight: 650;
  white-space: nowrap;
  box-shadow: 0 2px 5px rgba(32, 82, 115, .13);
  transition: background .15s, transform .12s, box-shadow .15s;
}
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn:not(.sub):not(.danger):hover { background: var(--accent-dark); }
.btn.sub { background: #fbfdff; border: 1px solid var(--line); color: var(--text); box-shadow: none; }
.btn.danger { background: #fffafa; border: 1px solid #e8caca; color: var(--danger); box-shadow: none; }
/* 2026.11.13 Ver.2.2：カレンダーの「今日」ボタンは緑で強調 */
#calToday { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 2px 5px rgba(35, 132, 91, .18); }
#calToday:hover { background: var(--green-dark); }
#menu {
  display: none;
  margin-top: 8px;
  gap: 8px;
}
#menu.open { display: flex; }
#menu .btn { flex: 1; }

/* ===== 本文（スクロール） ===== */
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #DDE5ED; }
#info {
  padding: 15px 13px;
  background: #ffffff;
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 8px rgba(35, 55, 75, .035);
}
#infoDate { color: var(--sub); font-size: 14px; }
/* 2026.11.13 変更：バージョン表示（日付の右横） */
#infoHead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
#ver { color: #9aa6b5; font-size: 12px; white-space: nowrap; }
#infoPractice { font-size: 20px; font-weight: 750; letter-spacing: .01em; margin: 4px 0 8px; word-break: break-word; color: #20384c; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
/* 2026.11.13 変更：設定修正ボタンと操作ヒントを追加 */
#infoBtns { display: flex; gap: 8px; margin-top: 12px; }
#infoBtns .btn { height: 34px; font-size: 13px; padding: 0 12px; }
#infoHint { margin-top: 10px; font-size: 12px; color: var(--sub); }
#infoDate, #infoPractice, #infoChips { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
#empty { padding: 40px 16px; text-align: center; color: var(--sub); line-height: 1.8; }

.entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid #e6ebf0;
  background: #ffffff;
}
/* 2026.11.13 変更：ダブルクリック/ダブルタップ用に文字選択とズームを無効化 */
.entry .body { flex: 1; min-width: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.entry.time .body { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* 2026.11.13 追加：各記録の登録時刻・更新時刻 */
.entry .stamp { display: block; margin-top: 3px; color: #8994a3; font-size: 11px; line-height: 1.3; font-weight: 400; text-align: right; font-variant-numeric: tabular-nums; }
.entry.memo { background: #f1f5f8; }
.entry.memo .body { font-size: 15px; color: var(--sub); white-space: pre-wrap; word-break: break-word; padding-left: 12px; }
.entry.best { background: rgba(242, 183, 5, 0.22); border-left: 4px solid var(--gold); }
.entry.best .body { color: var(--gold-text); }
.badge { margin-left: 8px; font-size: 12px; font-weight: 700; color: #1a1300; background: var(--gold); border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
.x { flex: none; width: 36px; height: 36px; background: transparent; border: none; color: var(--sub); font-size: 18px; }

/* 2026.11.13 変更：行の修正・挿入エディタ */
.editor { padding: 10px 12px; border-bottom: 1px solid var(--line); background: rgba(31, 122, 224, 0.08); }
.editor .erow { display: flex; gap: 6px; align-items: flex-end; }
.editor .erow .btn { height: 46px; padding: 0 12px; }
.editor textarea {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 9px 10px;
  background: #F2F9F3;
  border: 2px solid var(--accent);
  border-radius: 8px;
  font-size: 18px;
  line-height: 24px;
  resize: none;
  overflow-y: auto;
}
.epreview { min-height: 18px; padding: 2px 4px 0; font-size: 14px; color: var(--gold-text); }
.ebtns { display: flex; gap: 6px; margin-top: 6px; }
.ebtns .btn { flex: 1; height: 40px; padding: 0 8px; }

/* ===== 固定フッター（入力） ===== */
#bar {
  flex: none;
  padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, #edf2f6 0%, #e8eef3 100%);
  border-top: 1px solid var(--line);
  box-shadow: 0 -2px 8px rgba(35, 55, 75, .045);
}
/* 2026.11.13 変更：日本語入力時はスラッシュボタンを非表示 */
#slashBtn { display: none; }
#preview { min-height: 20px; padding: 0 4px 4px; font-size: 14px; color: var(--gold-text); }
#entryForm { display: flex; gap: 6px; }
/* 2026.11.13 変更：入力欄を複数行（書いている間だけ上下に広がる）に変更 */
#entryForm { align-items: flex-end; }
#entry {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 10px;
  background: #F2F9F3;
  border: 1px solid #D2E6D7;
  border-radius: 8px;
  font-size: 18px;
  line-height: 24px;
  resize: none;
  overflow-y: auto;
}
#bar .btn { height: 46px; padding: 0 12px; }

/* 2026.11.13 変更：数字キーパッド（文字入力中でも一瞬で数字を打てる） */
#keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 6px; }
#keypad[hidden] { display: none; }
#keypad button {
  height: 46px;
  font-size: 22px;
  font-weight: 600;
  background: #F2F9F3;
  border: 1px solid #D2E6D7;
  border-radius: 8px;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
#keypad button:active { background: var(--panel); }
#keypad .fn { background: var(--panel); font-size: 18px; }
/* 2026.11.13 変更：キーパッド表示中は、同じ働きの「追加」「／」「保存」ボタンを隠して1つにする */
body.numpad #entryForm button[type="submit"],
body.numpad #slashBtn,
body.numpad .editor .erow .btn,
body.numpad .ebtns .btn.primary { display: none; }
#keypad .wide { grid-column: span 3; background: var(--accent); border-color: var(--accent); color: #fff; font-size: 18px; }

/* ===== 新規ページ入力・設定修正 ===== */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(28, 36, 48, 0.55);
  overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top)) 12px 24px;
}
#overlay.open { display: block; }
#newForm { max-width: 480px; margin: 0 auto; padding: 16px; background: #EAF7ED; border: 1px solid #D2E6D7; border-radius: 12px; }
#newForm h2 { margin: 0 0 12px; font-size: 18px; }
#newForm label, #newForm .lab { display: block; margin-top: 12px; font-size: 14px; color: var(--sub); }
#newForm input, #newForm select {
  display: block;
  width: 100%;
  height: 44px;
  margin-top: 4px;
  padding: 0 10px;
  background: #F5FBF6;
  border: 1px solid #D2E6D7;
  border-radius: 8px;
}
/* 2026.11.13 変更：日付欄が右にはみ出る問題の修正（iPhoneのSafari対策） */
#newForm input, #newForm select { min-width: 0; max-width: 100%; }
#newForm input[type="date"] { text-align: left; }
@media (pointer: coarse) {
  #newForm input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
    line-height: 44px;
  }
  #newForm input[type="date"]::-webkit-date-and-time-value { text-align: left; }
}
/* 2026.11.13 Ver.2.5：入力・選択欄の淡いグリーンを統一 */
#newForm input:required { border: 3px solid var(--accent); }
#newForm #fTemp, #newForm #fWeather { background: #F5FBF6; }
#newForm input::placeholder { color: #9aa6b5; }
#newForm .req { margin-left: 6px; font-size: 12px; color: #9aa6b5; }
/* 2026.11.13 変更：場所・練習内容を「選択も直接入力もできる窓」に変更 */
#newForm .combo { display: flex; gap: 6px; }
#newForm .combo input { flex: 1; min-width: 0; }
#newForm .combo select { width: 110px; flex: none; }
#newBtns { display: flex; gap: 8px; margin-top: 18px; }
#newBtns .btn { flex: 1; }

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(90px + env(safe-area-inset-bottom));
  transform: translateX(-50%);
  max-width: 90%;
  padding: 10px 16px;
  background: #1c2430;
  color: #fff;
  border: 1px solid var(--line);
  border-radius: 8px;
  font-size: 14px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
  z-index: 20;
}
#toast.show { opacity: 1; }
</style>
</head>
<body>

<!-- 固定ヘッダー：ページ選択 -->
<header id="top">
  <div id="topRow">
    <select id="pageSel" aria-label="選択した日付のノート"></select>
    <button id="dateBtn" class="btn sub" type="button" aria-label="日付変更">日付</button>
    <input id="datePicker" type="date" aria-label="表示する日付">
    <button id="newBtn" class="btn" type="button">＋新規</button>
    <button id="menuBtn" class="btn sub" type="button" aria-label="メニュー">⋯</button>
  </div>
  <div id="menu">
    <button id="exportBtn" class="btn sub" type="button">バックアップ書き出し</button>
    <button id="importBtn" class="btn sub" type="button">読み込み</button>
    <input id="importFile" type="file" accept="application/json,.json" hidden>
  </div>
</header>

<!-- 本文 -->
<main id="main">
  <div id="empty">まだ記録がありません。<br>「＋新規」から練習ページを作成してください。</div>
  <section id="info" hidden>
    <!-- 2026.11.13 変更：日付の横にバージョン表示 -->
    <div id="infoHead"><span id="infoDate"></span><span id="ver">Ver.2.5  nakaZ</span></div>
    <div id="infoPractice"></div>
    <div class="chips" id="infoChips"></div>
    <div id="infoBtns">
      <button id="infoEdit" class="btn sub" type="button">設定を修正</button>
      <button id="infoDel" class="btn danger" type="button">このページを削除</button>
    </div>
    <div id="infoHint">記録の行をダブルタップ（PCはダブルクリック）で修正・挿入できます。上の日付や練習名をダブルタップすると設定を修正できます。</div>
  </section>
  <div id="list"></div>
</main>

<!-- 固定フッター：タイム・メモ入力 -->
<footer id="bar">
  <div id="preview"></div>
  <!-- 2026.11.13 変更：数字キーパッド -->
  <div id="keypad" hidden>
    <button type="button" data-k="1">1</button>
    <button type="button" data-k="2">2</button>
    <button type="button" data-k="3">3</button>
    <button type="button" data-k="bs" class="fn" aria-label="1文字消す">⌫</button>
    <button type="button" data-k="4">4</button>
    <button type="button" data-k="5">5</button>
    <button type="button" data-k="6">6</button>
    <button type="button" data-k="/" class="fn">／</button>
    <button type="button" data-k="7">7</button>
    <button type="button" data-k="8">8</button>
    <button type="button" data-k="9">9</button>
    <button type="button" data-k="kana" class="fn" aria-label="文字キーボードに切替">あ</button>
    <button type="button" data-k="0">0</button>
    <button type="button" data-k="ok" class="wide" id="kOk">追加</button>
  </div>
  <form id="entryForm" autocomplete="off">
    <button id="modeBtn" class="btn sub" type="button" aria-label="キーボード切替">123</button>
    <button id="slashBtn" class="btn sub" type="button" aria-label="スラッシュ入力">／</button>
    <textarea id="entry" rows="1" inputmode="text" enterkeyhint="done" placeholder="1/02/333 またはメモ"></textarea>
    <button class="btn" type="submit">追加</button>
  </form>
</footer>

<!-- 新規ページ作成・設定修正（共用） -->
<div id="overlay">
  <form id="newForm" autocomplete="off">
    <h2 id="formTitle">新しい練習ページ</h2>

    <label>日付<span class="req">必須</span>
      <input id="fDate" type="date" required>
    </label>

    <!-- 2026.11.13 変更：場所は直接入力、または右の「選択」から選べる -->
    <div class="lab">場所（直接入力、または右から選択）</div>
    <div class="combo">
      <input id="fPlace" type="text" required placeholder="必須：場所を入力">
      <select id="fPlacePick" aria-label="場所を選ぶ"></select>
    </div>

    <label>天気
      <select id="fWeather"></select>
    </label>

    <label>気温（℃）
      <input id="fTemp" type="number" inputmode="decimal" step="0.1" placeholder="例 18">
    </label>

    <!-- 2026.11.13 変更：練習内容も、直接入力または右の「選択」から選べる -->
    <div class="lab">何を練習？（直接入力、または右から選択）</div>
    <div class="combo">
      <input id="fPractice" type="text" required placeholder="必須：練習内容を入力">
      <select id="fPracticePick" aria-label="練習内容を選ぶ"></select>
    </div>

    <div id="newBtns">
      <button id="newCancel" class="btn sub" type="button">キャンセル</button>
      <button id="formOk" class="btn" type="submit">登録</button>
    </div>
  </form>
</div>

<!-- 2026.11.13 Ver.2.2：スマホ対応の日付カレンダー -->
<div id="calendarOverlay" aria-hidden="true">
  <section id="calendarPanel" role="dialog" aria-modal="true" aria-label="日付を選択">
    <div id="calendarHead">
      <button id="calPrev" class="cal-nav" type="button" aria-label="前の月">‹</button>
      <div id="calendarMonth"></div>
      <button id="calNext" class="cal-nav" type="button" aria-label="次の月">›</button>
    </div>
    <div id="calendarGrid"></div>
    <div id="calendarLegend"><span class="sample"></span> ノートがある日付</div>
    <div id="calendarActions">
      <button id="calToday" class="btn sub" type="button">今日</button>
      <button id="calClose" class="btn sub" type="button">閉じる</button>
    </div>
  </section>
</div>
<div id="toast"></div>

<script>
// 2026.11.13
(function () {
  'use strict';

  var KEY = 'motoGymkhanaLog.v1';
  // 2026.11.13 変更：「その他」を廃止（直接入力できるため）
  // 2026.11.13 変更：場所にも「その他」を追加（選ぶと入力窓が空になり、手入力できる）
  var PLACES = ['キョウセイ２輪', 'キョウセイ４輪', 'PPS', 'レインボー', 'その他'];
  // 2026.11.13 変更：練習内容の選択肢（「その他」を選ぶと入力窓が空になり、手入力できる）
  var PRACTICES = ['8の字GP', '回転弁当', '牛丼弁当', 'アタックコース', 'その他'];
  var WEATHERS = ['晴れ', '曇り', '雨'];
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  var $ = function (id) { return document.getElementById(id); };
  var pageSel = $('pageSel'), main = $('main'), listEl = $('list');
  var entry = $('entry'), preview = $('preview');

  // 2026.11.13 変更：修正中の行（{id, mode:'edit'|'insert'}）
  var editing = null;
  // 2026.11.13 変更：設定修正中のページID（null なら新規作成）
  var formEditId = null;

  // ---------- 保存・読込 ----------
  function load() {
    try {
      var s = JSON.parse(localStorage.getItem(KEY));
      if (s && Array.isArray(s.pages)) {
        if (!s.current) s.current = null;
        if (!s.selectedDate) s.selectedDate = '';
        return s;
      }
    } catch (e) { /* 読めない場合は空で開始 */ }
    return { pages: [], current: null, selectedDate: '' };
  }
  var state = load();

  function save() {
    try {
      state.selectedDate = selectedDate;
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      toast('保存に失敗しました（容量不足など）');
    }
  }

  // ---------- 共通 ----------
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function wdOf(s) {
    var p = s.split('-');
    return WD[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  }
  function formatDate(s) {
    var p = s.split('-');
    return p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日（' + wdOf(s) + '）';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  function sortedPages() {
    return state.pages.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return a.created - b.created;
    });
  }
  function currentPage() {
    for (var i = 0; i < state.pages.length; i++) {
      if (state.pages[i].id === state.current) return state.pages[i];
    }
    return null;
  }
  // 2026.11.13 追加：現在表示する日付。旧データでは選択中ページの日付を引き継ぐ。
  var selectedDate = state.selectedDate || (currentPage() ? currentPage().date : (sortedPages().length ? sortedPages()[sortedPages().length - 1].date : todayStr()));
  state.selectedDate = selectedDate;

  function timeText(value) {
    if (!value) return '';
    var d = new Date(value);
    if (isNaN(d.getTime())) return '';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function entryStamp(e) {
    var value = e.updatedAt || e.createdAt;
    var text = timeText(value);
    if (!text) return '';
    return (e.updatedAt ? '更新 ' : '') + text;
  }
  // 以前の保存データ（その他＋手入力）にも対応
  function placeText(p) {
    return (p.place === 'その他' && p.placeOther) ? p.placeOther : p.place;
  }
  function indexOfEntry(p, id) {
    for (var i = 0; i < p.entries.length; i++) {
      if (p.entries[i].id === id) return i;
    }
    return -1;
  }

  // 2026.11.13 変更：ダブルクリック（PC）／ダブルタップ（スマホ）
  function onDouble(target, fn) {
    var last = 0;
    target.addEventListener('dblclick', function (ev) {
      ev.preventDefault();
      fn();
    });
    target.addEventListener('touchend', function (ev) {
      var now = Date.now();
      if (now - last < 350) {
        ev.preventDefault();
        last = 0;
        fn();
      } else {
        last = now;
      }
    });
  }

  // ---------- タイム入力ルール ----------
  // 全角数字・全角スラッシュのみで構成されている場合は半角に直す
  function norm(v) {
    if (/^[0-9０-９\/／]*$/.test(v)) {
      return v.replace(/[０-９]/g, function (c) {
        return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
      }).replace(/／/g, '/');
    }
    return v;
  }
  // 数字とスラッシュだけの入力中に、秒は59まで・秒以下は3桁までに制限
  function liveOk(v) {
    if (!/^[0-9\/]*$/.test(v) || v.indexOf('/') < 0) return true;
    var p = v.split('/');
    if (p.length > 3) return false;
    if (p[0] === '' || p[0].length > 2) return false;
    if (p.length >= 2) {
      if (p[1].length > 2) return false;
      if (p[1] !== '' && Number(p[1]) > 59) return false;
    }
    if (p.length === 3) {
      if (p[1] === '') return false;
      if (p[2].length > 3) return false;
    }
    return true;
  }
  // 1/02/333 → 1分02秒333（秒以下が3桁未満なら右を0で埋める：36 → 360）
  function parseTime(v) {
    var m = /^(\d{1,2})\/(\d{1,2})\/(\d{1,3})$/.exec(v);
    if (!m) return null;
    var min = Number(m[1]);
    var sec = Number(m[2]);
    if (sec > 59) return null;
    var ms3 = m[3];
    while (ms3.length < 3) ms3 += '0';
    return {
      ms: min * 60000 + sec * 1000 + Number(ms3),
      text: min + '分' + pad2(sec) + '秒' + ms3
    };
  }
  // 2026.11.13 変更：入力文字から記録（タイム or メモ）を作る
  function buildEntry(raw) {
    var t = parseTime(norm(raw));
    if (t) return { type: 'time', ms: t.ms, text: t.text };
    return { type: 'memo', text: raw };
  }
  // 2026.11.13 変更：記録を修正用の入力文字（1/02/333）に戻す
  function editText(e) {
    if (e.type !== 'time') return e.text;
    var min = Math.floor(e.ms / 60000);
    var sec = Math.floor((e.ms % 60000) / 1000);
    var ms = e.ms % 1000;
    return min + '/' + pad2(sec) + '/' + ('00' + ms).slice(-3);
  }
  // 2026.11.13 変更：入力欄にタイムのルールを付ける（下の入力欄と修正欄で共用）
  function attachRules(inp, pv) {
    var prev = inp.value;
    // 2026.11.13 変更：書いている間だけ入力欄を上下に広げる（画面の約35%まで）
    function grow() {
      if (document.activeElement !== inp) return;
      var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      inp.style.height = 'auto';
      var h = Math.min(inp.scrollHeight + 4, Math.round(vh * 0.35));
      inp.style.height = Math.max(h, 46) + 'px';
    }
    inp.addEventListener('focus', grow);
    inp.addEventListener('blur', function () {
      inp.style.height = '';
      inp.scrollTop = 0;
    });
    // 2026.11.13 変更：Enterで改行、登録ボタンで保存
    inp.addEventListener('keydown', function (e) {
      // 日本語IMEの変換中は標準動作に任せる
      if (e.isComposing || e.keyCode === 229) return;

      // Enterは改行として使用する
      // 保存は登録・保存ボタンで行う
    });

    function show() {
      var t = parseTime(norm(inp.value));
      pv.textContent = t ? '→ ' + t.text : '';
      grow();
    }
    // 2026.11.13 変更：日本語IME入力中のカーソル・変換状態を保護
    function apply() {
      var v = norm(inp.value);

      if (!liveOk(v)) {
        inp.value = prev;
      } else {
        // 値が変わった場合だけ再代入する
        if (inp.value !== v) {
          inp.value = v;
        }
        prev = v;
      }
      show();
    }
    inp.addEventListener('input', function (e) {
      if (e.isComposing) return;
      apply();
    });
    inp.addEventListener('compositionend', apply);
    var api = {
      show: show,
      reset: function () { prev = ''; inp.value = ''; pv.textContent = ''; grow(); },
      // 2026.11.13 変更：キーパッド用（末尾に1文字追加／1文字消す）
      append: function (ch) {
        var v = inp.value + ch;
        if (liveOk(v)) { inp.value = v; prev = v; show(); }
      },
      backspace: function () {
        var v = inp.value.slice(0, -1);
        inp.value = v;
        prev = v;
        show();
      },
      insertSlash: function () {
        api.append('/');
        inp.focus();
      }
    };
    inp._rules = api;
    return api;
  }

  // 2026.11.13 変更：数字キーパッドと入力方式の切替
  // numMode=true：画面の数字キーパッドで入力（システムのキーボードは出さない）
  // numMode=false：システムの文字キーボード
  // 初期状態は文字入力（日本語キーボード）
  var numMode = false;
  var activeInput = entry;
  document.addEventListener('focusin', function (e) {
    if (e.target && e.target._rules) {
      activeInput = e.target;
      updateOk();
    }
  });
  // キーパッドの実行ボタンの表示を、入力中の欄に合わせる（追加／保存／挿入）
  function updateOk() {
    var inp = document.body.contains(activeInput) ? activeInput : entry;
    $('kOk').textContent = inp._okLabel || '追加';
  }
  function modeAttr() { return numMode ? 'none' : 'text'; }
  function applyMode() {
    $('keypad').hidden = !numMode;
    document.body.classList.toggle('numpad', numMode);
    $('modeBtn').textContent = numMode ? 'あ' : '123';
    document.querySelectorAll('input,textarea').forEach(function (i) {
      if (i._rules) i.setAttribute('inputmode', modeAttr());
    });
  }
  function toggleMode() {
    numMode = !numMode;
    applyMode();
    var inp = document.body.contains(activeInput) ? activeInput : entry;
    inp.blur();
    inp.focus();
  }
  function submitForm(form) {
    if (!form) return;
    if (form.requestSubmit) {
      form.requestSubmit();
    } else {
      form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
    }
  }

  // ---------- 描画 ----------
  function renderSelect() {
    var pages = sortedPages().filter(function (p) { return p.date === selectedDate; });
    pageSel.textContent = '';
    if (!pages.length) {
      var o = el('option', '', 'この日のノートはありません');
      o.value = '';
      pageSel.appendChild(o);
      pageSel.disabled = true;
      return;
    }
    pageSel.disabled = false;
    pages.forEach(function (p, index) {
      var label = (index + 1) + '冊目　' + p.practice;
      var opt = el('option', '', label);
      opt.value = p.id;
      if (p.id === state.current) opt.selected = true;
      pageSel.appendChild(opt);
    });
  }

  function renderInfo() {
    var p = currentPage();
    var empty = $('empty');
    empty.hidden = !!p;
    $('info').hidden = !p;
    $('entryForm').querySelectorAll('textarea,button').forEach(function (e) { e.disabled = !p; });
    if (!p) {
      empty.textContent = formatDate(selectedDate) + 'のノートはありません。「＋新規」から、この日付のノートを作成できます。';
      return;
    }
    $('infoDate').textContent = formatDate(p.date);
    $('infoPractice').textContent = p.practice;
    var chips = $('infoChips');
    chips.textContent = '';
    chips.appendChild(el('span', 'chip', placeText(p)));
    chips.appendChild(el('span', 'chip', p.weather));
    if (p.temp !== '' && p.temp !== null && p.temp !== undefined) {
      chips.appendChild(el('span', 'chip', p.temp + '℃'));
    }
  }

  // 2026.11.13 変更：修正・挿入用のエディタ行
  // buttons: [{label, cls, submit, onClick(入力値)}]
  function buildEditor(initial, placeholder, buttons) {
    var form = el('form', 'editor');
    form.autocomplete = 'off';
    var row = el('div', 'erow');
    var slash = el('button', 'btn sub', '／');
    slash.type = 'button';
    var inp = el('textarea');
    inp.rows = 1;
    inp.value = initial;
    inp.placeholder = placeholder;
    inp.setAttribute('inputmode', modeAttr());
    var pv = el('div', 'epreview');
    var rules = attachRules(inp, pv);
    rules.show();
    slash.addEventListener('click', rules.insertSlash);
    row.appendChild(slash);
    row.appendChild(inp);
    var btns = el('div', 'ebtns');
    buttons.forEach(function (b) {
      var bt = el('button', 'btn ' + (b.cls || '') + (b.submit ? ' primary' : ''), b.label);
      bt.type = b.submit ? 'submit' : 'button';
      if (b.submit) inp._okLabel = b.label;
      if (!b.submit) {
        bt.addEventListener('click', function () { b.onClick(inp.value.trim()); });
      }
      btns.appendChild(bt);
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var ok = buttons.filter(function (b) { return b.submit; })[0];
      if (ok) ok.onClick(inp.value.trim());
    });
    form.appendChild(row);
    form.appendChild(pv);
    form.appendChild(btns);
    return form;
  }

  function saveEdit(p, e, raw) {
    if (!raw) {
      toast('空欄は保存できません（削除は ✕ で）');
      return false;
    }
    var idx = indexOfEntry(p, e.id);
    if (idx < 0) return false;
    var ne = buildEntry(raw);
    ne.id = e.id;
    ne.createdAt = e.createdAt || null;
    ne.updatedAt = Date.now();
    p.entries[idx] = ne;
    save();
    return true;
  }

  function buildEditRow(p, e) {
    var orig = editText(e);
    return buildEditor(orig, '1/02/333 またはメモ', [
      {
        label: '保存', submit: true,
        onClick: function (raw) {
          if (saveEdit(p, e, raw)) { editing = null; renderList(); }
        }
      },
      {
        label: 'この下に挿入', cls: 'sub',
        onClick: function (raw) {
          if (raw !== orig && !saveEdit(p, e, raw)) return;
          editing = { id: e.id, mode: 'insert' };
          renderList();
        }
      },
      {
        label: '取消', cls: 'sub',
        onClick: function () { editing = null; renderList(); }
      }
    ]);
  }

  function buildInsertRow(p, e) {
    return buildEditor('', '挿入：1/02/333 またはメモ', [
      {
        label: '挿入', submit: true,
        onClick: function (raw) {
          if (!raw) return;
          var idx = indexOfEntry(p, e.id);
          if (idx < 0) return;
          var ne = buildEntry(raw);
          ne.id = uid();
          ne.createdAt = Date.now();
          ne.updatedAt = null;
          p.entries.splice(idx + 1, 0, ne);
          save();
          editing = { id: ne.id, mode: 'insert' };
          renderList();
        }
      },
      {
        label: '完了', cls: 'sub',
        onClick: function () { editing = null; renderList(); }
      }
    ]);
  }

  function buildRow(p, e, isBest) {
    var row = el('div', 'entry ' + e.type + (isBest ? ' best' : ''));
    var body = el('div', 'body', e.text);
    if (isBest) body.appendChild(el('span', 'badge', 'BEST'));
    var stamp = entryStamp(e);
    if (stamp) body.appendChild(el('span', 'stamp', stamp));
    onDouble(body, function () {
      editing = { id: e.id, mode: 'edit' };
      renderList();
    });
    var x = el('button', 'x', '✕');
    x.type = 'button';
    x.setAttribute('aria-label', '削除');
    x.addEventListener('click', function () {
      if (!confirm('この行を削除しますか？\n' + e.text)) return;
      p.entries = p.entries.filter(function (z) { return z.id !== e.id; });
      editing = null;
      save();
      renderList();
    });
    row.appendChild(body);
    row.appendChild(x);
    return row;
  }

  function renderList() {
    listEl.textContent = '';
    var p = currentPage();
    if (!p) return;
    var best = null;
    p.entries.forEach(function (e) {
      if (e.type === 'time' && (best === null || e.ms < best)) best = e.ms;
    });
    p.entries.forEach(function (e) {
      if (editing && editing.mode === 'edit' && editing.id === e.id) {
        listEl.appendChild(buildEditRow(p, e));
      } else {
        listEl.appendChild(buildRow(p, e, e.type === 'time' && e.ms === best));
      }
      if (editing && editing.mode === 'insert' && editing.id === e.id) {
        listEl.appendChild(buildInsertRow(p, e));
      }
    });
    var ei = listEl.querySelector('.editor textarea');
    if (ei) ei.focus();
    updateOk();
  }

  function renderAll(scrollToBottom) {
    editing = null;
    var p = currentPage();
    if (!p || p.date !== selectedDate) {
      var sameDay = sortedPages().filter(function (x) { return x.date === selectedDate; });
      state.current = sameDay.length ? sameDay[sameDay.length - 1].id : null;
    }
    state.selectedDate = selectedDate;
    $('datePicker').value = selectedDate;
    $('dateBtn').textContent = selectedDate.slice(5).replace('-', '/');
    $('dateBtn').title = formatDate(selectedDate) + 'を表示中。クリックして変更';
    renderSelect();
    renderInfo();
    renderList();
    main.scrollTop = scrollToBottom ? main.scrollHeight : 0;
  }

  // ---------- ページ操作 ----------
  pageSel.addEventListener('change', function () {
    state.current = pageSel.value || null;
    save();
    renderAll(true);
  });

  // 2026.11.13 Ver.2.2：独自カレンダー。スマホ標準 date picker に依存しない。
  var calendarMonth = (function () {
    var p = (selectedDate || todayStr()).split('-');
    return new Date(Number(p[0]), Number(p[1]) - 1, 1);
  })();

  function closeCalendar() {
    $('calendarOverlay').classList.remove('open');
    $('calendarOverlay').setAttribute('aria-hidden', 'true');
  }

  function chooseCalendarDate(date) {
    selectedDate = date;
    state.selectedDate = selectedDate;
    state.current = null;
    save();
    closeCalendar();
    renderAll(false);
  }

  function renderCalendar() {
    var year = calendarMonth.getFullYear();
    var month = calendarMonth.getMonth();
    $('calendarMonth').textContent = year + '年' + (month + 1) + '月';
    var grid = $('calendarGrid');
    grid.textContent = '';
    WD.forEach(function (w) {
      grid.appendChild(el('div', 'cal-week', w));
    });

    var first = new Date(year, month, 1).getDay();
    var days = new Date(year, month + 1, 0).getDate();
    var counts = {};
    state.pages.forEach(function (p) {
      if (p && p.date) counts[p.date] = (counts[p.date] || 0) + 1;
    });

    for (var i = 0; i < first; i++) {
      grid.appendChild(el('div', 'cal-day empty', ''));
    }
    for (var d = 1; d <= days; d++) {
      var date = year + '-' + pad2(month + 1) + '-' + pad2(d);
      var count = counts[date] || 0;
      var cls = 'cal-day';
      if (count) cls += ' has-notes';
      if (date === selectedDate) cls += ' selected';
      if (date === todayStr()) cls += ' today';
      var b = el('button', cls, String(d));
      b.type = 'button';
      b.setAttribute('aria-label', date + (count ? ' ノート' + count + '冊' : ' ノートなし'));
      if (count) b.appendChild(el('span', 'cal-count', String(count)));
      b.addEventListener('click', (function (chosen) {
        return function () { chooseCalendarDate(chosen); };
      })(date));
      grid.appendChild(b);
    }
  }

  $('dateBtn').addEventListener('click', function () {
    var p = (selectedDate || todayStr()).split('-');
    calendarMonth = new Date(Number(p[0]), Number(p[1]) - 1, 1);
    renderCalendar();
    $('calendarOverlay').classList.add('open');
    $('calendarOverlay').setAttribute('aria-hidden', 'false');
  });
  $('calPrev').addEventListener('click', function () {
    calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() - 1, 1);
    renderCalendar();
  });
  $('calNext').addEventListener('click', function () {
    calendarMonth = new Date(calendarMonth.getFullYear(), calendarMonth.getMonth() + 1, 1);
    renderCalendar();
  });
  $('calToday').addEventListener('click', function () { chooseCalendarDate(todayStr()); });
  $('calClose').addEventListener('click', closeCalendar);
  $('calendarOverlay').addEventListener('click', function (e) {
    if (e.target === this) closeCalendar();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('calendarOverlay').classList.contains('open')) closeCalendar();
  });

  $('infoDel').addEventListener('click', function () {
    var p = currentPage();
    if (!p) return;
    if (!confirm('このページを削除しますか？\n' + formatDate(p.date) + ' ' + p.practice + '\n（記録も全て消えます）')) return;
    state.pages = state.pages.filter(function (x) { return x.id !== p.id; });
    state.current = null;
    // 同じ日付に別ノートが残っていれば、その日の最後のノートを表示する。
    save();
    renderAll(true);
  });

  // ---------- 新規ページ・設定修正（共用フォーム） ----------
  function fillOptions(sel, items) {
    items.forEach(function (t) {
      var o = el('option', '', t);
      o.value = t;
      sel.appendChild(o);
    });
  }
  // 2026.11.13 変更：場所の「選択」ボタン（選ぶと左の入力窓に入る。そのまま手直しもできる）
  var pickHead = el('option', '', '▼ 選択');
  pickHead.value = '';
  $('fPlacePick').appendChild(pickHead);
  fillOptions($('fPlacePick'), PLACES);
  fillOptions($('fWeather'), WEATHERS);

  $('fPlacePick').addEventListener('change', function () {
    var v = $('fPlacePick').value;
    if (v === 'その他') {
      $('fPlace').value = '';
    } else if (v) {
      $('fPlace').value = v;
    }
    $('fPlacePick').selectedIndex = 0;
    $('fPlace').focus();
  });

  // 2026.11.13 変更：練習内容の選択（「その他」は窓を空にして手入力）
  var pickHead2 = el('option', '', '▼ 選択');
  pickHead2.value = '';
  $('fPracticePick').appendChild(pickHead2);
  fillOptions($('fPracticePick'), PRACTICES);

  $('fPracticePick').addEventListener('change', function () {
    var v = $('fPracticePick').value;
    if (v === 'その他') {
      $('fPractice').value = '';
    } else if (v) {
      $('fPractice').value = v;
    }
    $('fPracticePick').selectedIndex = 0;
    $('fPractice').focus();
  });

  // page が null なら新規作成、ページを渡すとその設定の修正
  // 2026.11.13 変更：日付欄はどこをクリック（タップ）してもカレンダーが開く
  $('fDate').addEventListener('click', function () {
    try {
      if (this.showPicker) this.showPicker();
    } catch (err) { /* 開けない環境では標準の動作のまま */ }
  });

  function openForm(page) {
    $('newForm').reset();
    formEditId = page ? page.id : null;
    $('formTitle').textContent = page ? '練習ページの設定を修正' : '新しい練習ページ';
    $('formOk').textContent = page ? '保存' : '登録';
    if (page) {
      $('fDate').value = page.date;
      $('fPlace').value = placeText(page);
      $('fWeather').value = page.weather;
      $('fTemp').value = (page.temp === null || page.temp === undefined) ? '' : page.temp;
      $('fPractice').value = page.practice;
    } else {
      $('fDate').value = selectedDate || todayStr();
    }
    $('overlay').classList.add('open');
  }
  function closeForm() { $('overlay').classList.remove('open'); }

  $('newBtn').addEventListener('click', function () { openForm(null); });
  $('newCancel').addEventListener('click', closeForm);

  $('infoEdit').addEventListener('click', function () { openForm(currentPage()); });
  onDouble($('infoDate'), function () { openForm(currentPage()); });
  onDouble($('infoPractice'), function () { openForm(currentPage()); });
  onDouble($('infoChips'), function () { openForm(currentPage()); });

  $('newForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var date = $('fDate').value;
    var place = $('fPlace').value.trim();
    var weather = $('fWeather').value;
    var temp = $('fTemp').value.trim();
    var practice = $('fPractice').value.trim();
    if (!date || !place || !practice) return;

    if (formEditId) {
      var target = null;
      state.pages.forEach(function (x) { if (x.id === formEditId) target = x; });
      if (!target) { closeForm(); return; }
      target.date = date;
      target.place = place;
      target.placeOther = '';
      target.weather = weather;
      target.temp = temp;
      target.practice = practice;
      target.updatedAt = Date.now();
      selectedDate = date;
      state.selectedDate = selectedDate;
      state.current = target.id;
      save();
      closeForm();
      renderAll(false);
      toast('設定を修正しました');
      return;
    }

    var page = {
      id: uid(),
      created: Date.now(),
      updatedAt: null,
      date: date,
      place: place,
      placeOther: '',
      weather: weather,
      temp: temp,
      practice: practice,
      entries: []
    };
    state.pages.push(page);
    state.current = page.id;
    selectedDate = date;
    state.selectedDate = selectedDate;
    save();
    closeForm();
    renderAll(false);
    entry.focus();
  });

  // ---------- 下部のタイム・メモ入力 ----------
  var rules = attachRules(entry, preview);

  $('slashBtn').addEventListener('click', rules.insertSlash);

  // 2026.11.13 変更：入力方式の切替ボタンとキーパッドの動作
  $('modeBtn').addEventListener('click', toggleMode);

  // キーパッドを押しても入力欄からフォーカスが外れないようにする
  $('keypad').addEventListener('mousedown', function (e) { e.preventDefault(); });
  $('keypad').addEventListener('click', function (e) {
    var b = e.target.closest ? e.target.closest('button') : null;
    if (!b) return;
    var inp = document.body.contains(activeInput) ? activeInput : entry;
    var k = b.getAttribute('data-k');
    if (k === 'kana') { toggleMode(); return; }
    if (!inp._rules) return;
    if (k === 'bs') inp._rules.backspace();
    else if (k === 'ok') submitForm(inp.form);
    else inp._rules.append(k);
  });
  applyMode();

  $('entryForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var p = currentPage();
    if (!p) return;
    var raw = entry.value.trim();
    if (!raw) return;
    var ne = buildEntry(raw);
    ne.id = uid();
    ne.createdAt = Date.now();
    ne.updatedAt = null;
    p.entries.push(ne);
    save();
    rules.reset();
    editing = null;
    renderList();
    main.scrollTop = main.scrollHeight;
    entry.focus();
  });

  // ---------- バックアップ ----------
  $('menuBtn').addEventListener('click', function () {
    $('menu').classList.toggle('open');
  });

  $('exportBtn').addEventListener('click', function () {
    var blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'moto-gymkhana-log-' + todayStr().replace(/-/g, '') + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  });

  $('importBtn').addEventListener('click', function () { $('importFile').click(); });

  // 2026.11.13 追加：JSONを既存データへ安全に統合する。
  // ノートID・記録IDで同一データを判定し、同じJSONの再読み込みによる重複を防ぐ。
  function entryContentKey(e) {
    return [e.type || '', e.text || '', (e.ms === undefined ? '' : e.ms)].join('|');
  }

  function mergeImportedData(incoming) {
    var addedPages = 0;
    var addedEntries = 0;
    var updatedEntries = 0;
    var duplicatedConflicts = 0;

    incoming.pages.forEach(function (sourcePage) {
      if (!sourcePage || typeof sourcePage !== 'object') return;
      var importedPage = JSON.parse(JSON.stringify(sourcePage));
      if (!importedPage.id) importedPage.id = uid();
      if (!Array.isArray(importedPage.entries)) importedPage.entries = [];
      if (!importedPage.created) importedPage.created = Date.now();

      var localPage = null;
      for (var i = 0; i < state.pages.length; i++) {
        if (state.pages[i].id === importedPage.id) {
          localPage = state.pages[i];
          break;
        }
      }

      if (!localPage) {
        var usedEntryIds = {};
        importedPage.entries.forEach(function (entryItem) {
          if (!entryItem || typeof entryItem !== 'object') return;
          if (!entryItem.id || usedEntryIds[entryItem.id]) entryItem.id = uid();
          usedEntryIds[entryItem.id] = true;
        });
        state.pages.push(importedPage);
        addedPages++;
        addedEntries += importedPage.entries.length;
        return;
      }

      if (!Array.isArray(localPage.entries)) localPage.entries = [];
      importedPage.entries.forEach(function (incomingEntry) {
        if (!incomingEntry || typeof incomingEntry !== 'object') return;
        if (!incomingEntry.id) incomingEntry.id = uid();
        var existing = null;
        for (var j = 0; j < localPage.entries.length; j++) {
          if (localPage.entries[j].id === incomingEntry.id) {
            existing = localPage.entries[j];
            break;
          }
        }
        if (!existing) {
          localPage.entries.push(incomingEntry);
          addedEntries++;
          return;
        }
        if (entryContentKey(existing) === entryContentKey(incomingEntry)) {
          var oldStamp = Number(existing.updatedAt || existing.createdAt || 0);
          var newStamp = Number(incomingEntry.updatedAt || incomingEntry.createdAt || 0);
          if (newStamp > oldStamp) {
            var replaceIndex = localPage.entries.indexOf(existing);
            localPage.entries[replaceIndex] = incomingEntry;
            updatedEntries++;
          }
          return;
        }
        // 同じIDなのに内容が異なる場合は、どちらも残すため別IDで追加する。
        var conflictCopy = JSON.parse(JSON.stringify(incomingEntry));
        conflictCopy.id = uid();
        localPage.entries.push(conflictCopy);
        addedEntries++;
        duplicatedConflicts++;
      });

      // ページ設定は既存データを優先する。新しい形式で更新日時が明確に新しい場合だけ更新。
      var localPageTime = Number(localPage.updatedAt || localPage.created || 0);
      var incomingPageTime = Number(importedPage.updatedAt || importedPage.created || 0);
      if (incomingPageTime > localPageTime && importedPage.updatedAt) {
        ['date', 'place', 'placeOther', 'weather', 'temp', 'practice', 'updatedAt'].forEach(function (key) {
          if (importedPage[key] !== undefined) localPage[key] = importedPage[key];
        });
      }
    });

    return {
      pages: addedPages,
      entries: addedEntries,
      updated: updatedEntries,
      conflicts: duplicatedConflicts
    };
  }

  $('importFile').addEventListener('change', function () {
    var f = $('importFile').files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var imported = JSON.parse(r.result);
        if (!imported || !Array.isArray(imported.pages)) throw new Error('形式が違います');
        if (!confirm('読み込んだノートを現在のデータに追加・統合します。\n既存のノートは削除しません。よろしいですか？')) return;
        var result = mergeImportedData(imported);
        // 読み込み後は、追加されたノートがあればその日付を表示する。
        if (imported.current) {
          var importedCurrent = null;
          for (var i = 0; i < state.pages.length; i++) {
            if (state.pages[i].id === imported.current) importedCurrent = state.pages[i];
          }
          if (importedCurrent) {
            state.current = importedCurrent.id;
            selectedDate = importedCurrent.date;
          }
        }
        if (!currentPage() || currentPage().date !== selectedDate) {
          var sameDay = sortedPages().filter(function (x) { return x.date === selectedDate; });
          state.current = sameDay.length ? sameDay[sameDay.length - 1].id : null;
        }
        state.selectedDate = selectedDate;
        save();
        renderAll(true);
        toast('読み込みました：ノート' + result.pages + '件・記録' + result.entries + '件を追加');
        if (result.conflicts) {
          setTimeout(function () { toast('同じIDで内容が異なる記録 ' + result.conflicts + '件は、別記録として残しました'); }, 2300);
        }
      } catch (err) {
        toast('読み込めませんでした：' + err.message);
      }
      $('importFile').value = '';
    };
    r.readAsText(f);
  });

  // ---------- 起動 ----------
  if (!selectedDate) selectedDate = todayStr();
  if (currentPage() && currentPage().date !== selectedDate) selectedDate = currentPage().date;
  if (!currentPage()) {
    var initialPages = sortedPages().filter(function (x) { return x.date === selectedDate; });
    state.current = initialPages.length ? initialPages[initialPages.length - 1].id : null;
  }
  state.selectedDate = selectedDate;
  renderAll(true);
  if (!state.pages.length) openForm(null);
})();
</script>
</body>
</html>
