<!-- 2026.11.17 Ver.4.2 練習を選ばずにタイムを入れたとき、入力欄のすぐ上に赤字で「練習を選んでください」と表示（選択欄も赤枠）。お知らせ（トースト）がキーボードの裏に隠れないよう位置を調整 -->
<!-- 2026.11.16 Ver.4.1 写真の行の右に「＋」を追加（この写真の下に挿入）。一番上の写真は「写真の上に挿入」も選べる -->
<!-- 2026.11.16 Ver.4.0 写真を1枚ずつ記録の流れに追加（縮小して端末内に保存、バックアップにも含める） -->
<!-- 2026.11.16 Ver.3.16 入力時に画面が勝手に拡大されて右が見切れる問題の対策 -->
<!-- 2026.11.16 Ver.3.15 気温などの入力欄を触ってキーボードが出ても、その欄が見えるよう自動スクロール -->
<!-- 2026.11.16 Ver.3.14 ノートがない日も余白を設けてバージョンを表示 -->
<!-- 2026.11.16 Ver.3.13 挿入後のスクロール位置を保持 -->
<!-- 2026.11.16 Ver.3.12 挿入ボタン押下後は編集・挿入モードを終了 -->
<!-- 2026.11.16 Ver.3.10 日付欄をタップ→カレンダーの日付を触ると入る／修正・挿入中は下の入力セットを隠す -->
<!-- 2026.11.16 Ver.3.9 日付を直接入力できるように（カレンダーは右のボタンから）／場所を一覧から選んだらキーボードを出さない -->
<!-- 2026.11.16 Ver.3.8 新規登録後にキーボードを出さない／修正欄を開いたら画面の上へスクロール -->
<!-- 2026.11.16 Ver.3.7 タイム・コメントを追加したらキーボードを自動で閉じる -->
<!-- 2026.11.16 Ver.3.6 コメント（メモ）の文字を大きく・濃くして読みやすく -->
<!-- 2026.11.16 Ver.3.5 分を省略した /50/222 を 0分50秒222 として入力できるように -->
<!-- 2026.11.16 Ver.3.4 あり得ないタイム（例 1/80/555）に赤いメッセージを表示 -->
<!-- 2026.11.16 Ver.3.3 1セットの枠をブラウン系の配色に変更 -->
<!-- 2026.11.16 Ver.3.2 「何の練習？」とタイム入力を1セットの枠にまとめて強調 -->
<!-- 2026.11.16 Ver.3.1 練習名を大きく表示／BESTを練習ごとに金色表示／独自数字キーを廃止し通常キーボードのみに変更 -->
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<!-- 2026.11.16 Ver.3.16 変更：入力欄を触ったときに画面が勝手に拡大されないよう maximum-scale=1 を追加 -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>ジムカーナ練習記録</title>
<style>
/* 2026.11.16 */
/* 2026.11.16 Ver.3.1：練習名タグを大きく。独自数字キーパッドを廃止（通常キーボードのみ） */
/* 2026.11.16 Ver.3.0：ページ＝日付×場所。タイム行に練習内容（ドロップダウン）を追加 */
/* 2026.11.13 Ver.2.5：選択欄全般を淡いグリーンに統一。メイン表示色は維持 */
:root {
  color-scheme: light;
  --bg: #DDE5ED;
  --panel: #eaf0f5;
  --line: #d7e0e8;
  --text: #243447;
  --sub: #68798b;
  --accent: #2878a8;
  --accent-dark: #1f628b;
  --green: #23845b;
  --green-dark: #1b6b49;
  --gold: #e9b949;
  --gold-text: #80601a;
  --danger: #c65353;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
  font-size: 16px;
}
button, input, select { font: inherit; color: inherit; }
/* 2026.11.16 Ver.3.16 追加：iPhone は16px未満の入力欄を触ると画面を自動拡大して右が見切れるため、入力欄の文字は16px以上にそろえる。横スクロールも出さない */
input, select, textarea { font-size: max(16px, 1em); }
html, body { max-width: 100%; overflow-x: hidden; }
#overlay, #main { overflow-x: hidden; }
#newForm, #newForm label, #newForm .combo, .pcontrol { max-width: 100%; }
button { cursor: pointer; }

/* ===== 固定ヘッダー（ページ選択） ===== */
#top {
  flex: none;
  padding: calc(8px + env(safe-area-inset-top)) 10px 8px;
  background: linear-gradient(180deg, #EAF7ED 0%, #E2F1E6 100%);
  border-bottom: 1px solid #D2E6D7;
  box-shadow: 0 2px 8px rgba(35, 55, 75, .05);
}
#topRow { display: flex; gap: 6px; align-items: center; }
#top .btn.sub { background: #F2FAF3; border-color: #D2E6D7; }
#pageSel {
  flex: 1;
  min-width: 0;
  height: 44px;
  padding: 0 8px;
  background: #F2FAF3;
  border: 1px solid #D2E6D7;
  border-radius: 8px;
}
/* 2026.11.13 追加：日付変更ボタン */
#dateBtn { flex: none; padding: 0 10px; }
#datePicker { display: none; }

/* 2026.11.13 Ver.2.2：スマホでも確実に操作できる日付カレンダー */
#calendarOverlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(20, 28, 40, .55);
  padding: 16px;
  align-items: center;
  justify-content: center;
}
#calendarOverlay.open { display: flex; }
#calendarPanel {
  width: min(100%, 390px);
  background: #EAF7ED;
  color: var(--text);
  border: 1px solid #CFE4D4;
  border-radius: 18px;
  padding: 16px;
  box-shadow: 0 18px 55px rgba(30, 50, 70, .24);
}
#calendarHead { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
#calendarMonth { flex: 1; text-align: center; font-size: 18px; font-weight: 700; }
.cal-nav { width: 42px; height: 42px; border: 1px solid #D2E6D7; border-radius: 10px; background: #F5FBF6; font-size: 22px; }
#calendarGrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
.cal-week { text-align: center; color: var(--sub); font-size: 12px; padding: 4px 0; }
.cal-day {
  min-width: 0; height: 42px; border: 1px solid transparent; border-radius: 10px;
  background: #F1F8F2; color: var(--text); font-size: 15px; position: relative;
  transition: background .15s, transform .15s;
}
.cal-day:active { transform: scale(.96); }
.cal-day.empty { visibility: hidden; }
.cal-day.has-notes { background: #2878a8; color: #fff; font-weight: 700; box-shadow: inset 0 -2px 0 rgba(0,0,0,.10); }
.cal-day.selected { outline: 3px solid #e9b949; outline-offset: 1px; }
.cal-day.today:not(.has-notes) { border-color: var(--green); color: var(--green); font-weight: 700; }
.cal-day .cal-count { position: absolute; right: 3px; top: 1px; font-size: 9px; line-height: 1; opacity: .9; }
#calendarLegend { display: flex; align-items: center; gap: 7px; margin: 12px 0; color: var(--sub); font-size: 12px; }
#calendarLegend .sample { width: 13px; height: 13px; border-radius: 4px; background: #2878a8; }
#calendarActions { display: flex; gap: 8px; margin-top: 12px; }
#calendarActions .btn { flex: 1; }
#calendarPanel .btn.sub { background: #F5FBF6; border-color: #D2E6D7; }
@media (max-width: 380px) {
  #calendarPanel { padding: 12px; }
  #calendarGrid { gap: 3px; }
  .cal-day { height: 39px; }
}
.btn {
  height: 44px;
  padding: 0 14px;
  background: var(--accent);
  border: 1px solid transparent;
  border-radius: 10px;
  color: #fff;
  font-weight: 650;
  white-space: nowrap;
  box-shadow: 0 2px 5px rgba(32, 82, 115, .13);
  transition: background .15s, transform .12s, box-shadow .15s;
}
.btn:active { transform: translateY(1px); box-shadow: none; }
.btn:not(.sub):not(.danger):hover { background: var(--accent-dark); }
.btn.sub { background: #fbfdff; border: 1px solid var(--line); color: var(--text); box-shadow: none; }
.btn.danger { background: #fffafa; border: 1px solid #e8caca; color: var(--danger); box-shadow: none; }
/* 2026.11.13 Ver.2.2：カレンダーの「今日」ボタンは緑で強調 */
#calToday { background: var(--green); border-color: var(--green); color: #fff; box-shadow: 0 2px 5px rgba(35, 132, 91, .18); }
#calToday:hover { background: var(--green-dark); }
#menu {
  display: none;
  margin-top: 8px;
  gap: 8px;
}
#menu.open { display: flex; }
#menu .btn { flex: 1; }

/* ===== 本文（スクロール） ===== */
#main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #DDE5ED; }
#info {
  padding: 15px 13px;
  background: #ffffff;
  border-bottom: 1px solid var(--line);
  box-shadow: 0 2px 8px rgba(35, 55, 75, .035);
}
#infoDate { color: var(--sub); font-size: 14px; }
/* 2026.11.13 変更：バージョン表示（日付の右横） */
#infoHead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
#ver { color: #9aa6b5; font-size: 12px; white-space: nowrap; }
/* 2026.11.16 変更：大見出しは「場所」を表示（旧：練習内容） */
#infoPractice { font-size: 20px; font-weight: 750; letter-spacing: .01em; margin: 4px 0 8px; word-break: break-word; color: #20384c; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { padding: 3px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: 14px; }
/* 2026.11.13 変更：設定修正ボタンと操作ヒントを追加 */
#infoBtns { display: flex; gap: 8px; margin-top: 12px; }
#infoBtns .btn { height: 34px; font-size: 13px; padding: 0 12px; }
#infoHint { margin-top: 10px; font-size: 12px; color: var(--sub); }
#infoDate, #infoPractice, #infoChips { touch-action: manipulation; -webkit-user-select: none; user-select: none; }
/* 2026.11.16 Ver.3.14 追加：ノートがない日もメッセージとVer表示の間に余白を設ける */
#empty { padding: 32px 16px 22px; text-align: center; color: var(--sub); line-height: 1.8; }
#emptyMessage { display: block; }
#emptyVer { display: block; margin-top: 16px; text-align: right; color: #9aa6b5; font-size: 12px; line-height: 1.4; white-space: nowrap; }

.entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 10px 12px;
  border-bottom: 1px solid #e6ebf0;
  background: #ffffff;
}
/* 2026.11.13 変更：ダブルクリック/ダブルタップ用に文字選択とズームを無効化 */
.entry .body { flex: 1; min-width: 0; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.entry.time .body { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
/* 2026.11.13 追加：各記録の登録時刻・更新時刻 */
.entry .stamp { display: block; margin-top: 3px; color: #8994a3; font-size: 11px; line-height: 1.3; font-weight: 400; text-align: right; font-variant-numeric: tabular-nums; }
/* 2026.11.16 追加：タイム行の練習内容タグ */
/* 2026.11.16 Ver.3.1 変更：練習名を大きく（12px → 18px・太字） */
.entry .ptag { display: inline-block; margin-left: 10px; padding: 3px 14px; font-size: 18px; font-weight: 700; color: var(--green-dark); background: #E3F1E6; border: 1px solid #BFDCC6; border-radius: 999px; vertical-align: middle; }
.entry.best .ptag { color: var(--gold-text); background: rgba(233, 185, 73, 0.25); border-color: var(--gold); }
/* 2026.11.16 Ver.3.6 変更：コメントを大きく・濃く（15px→19px、灰色→濃い紺、太さ500、行間を広く） */
/* 2026.11.16 Ver.3.11 変更：コメントの文字を深緑に（目に優しい色）。左線・背景もほんのり緑系に */
.entry.memo { background: #f5faf6; border-left: 4px solid #9fc2ac; }
.entry.memo .body { font-size: 19px; font-weight: 500; line-height: 1.55; letter-spacing: .02em; color: #1d4a33; white-space: pre-wrap; word-break: break-word; padding-left: 8px; }
.entry.best { background: rgba(242, 183, 5, 0.22); border-left: 4px solid var(--gold); }
.entry.best .body { color: var(--gold-text); }
.badge { margin-left: 8px; font-size: 12px; font-weight: 700; color: #1a1300; background: var(--gold); border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
.x { flex: none; width: 36px; height: 36px; background: transparent; border: none; color: var(--sub); font-size: 18px; }

/* 2026.11.13 変更：行の修正・挿入エディタ */
.editor { padding: 10px 12px; border-bottom: 1px solid var(--line); background: rgba(31, 122, 224, 0.08); }
.editor .erow { display: flex; gap: 6px; align-items: flex-end; }
.editor .erow .btn { height: 46px; padding: 0 12px; }
.editor textarea {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 9px 10px;
  background: #F2F9F3;
  border: 2px solid var(--accent);
  border-radius: 8px;
  font-size: 18px;
  line-height: 24px;
  resize: none;
  overflow-y: auto;
}
.epreview { min-height: 18px; padding: 2px 4px 0; font-size: 14px; color: var(--gold-text); }
/* 2026.11.16 Ver.3.8 追加：修正・挿入の欄を開いている間は、下に余白を足して、欄を画面の上までスクロールできるようにする */
#list.editing { padding-bottom: 60vh; }
/* 2026.11.16 Ver.3.10 追加：修正・挿入中は下の入力セットを隠す */
body.editingRow #bar { display: none; }
/* 2026.11.16 Ver.4.1 追加：写真の行の「＋」ボタン */
.x.plus { font-size: 22px; font-weight: 700; color: var(--accent); }
/* 2026.11.16 Ver.4.0 追加：写真の行と拡大表示 */
.entry.photo { background: #ffffff; }
.entry.photo .body .pimg { display: block; width: 100%; max-height: 38vh; min-height: 70px; object-fit: contain; background: #eef2f6; border-radius: 8px; cursor: zoom-in; -webkit-touch-callout: default; }
.entry.photo .body .pmiss { padding: 18px 10px; color: var(--sub); font-size: 14px; background: #eef2f6; border-radius: 8px; }
#photoView { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 20, .94); display: flex; flex-direction: column; }
#photoView[hidden] { display: none; }
#photoViewScroll { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; display: flex; align-items: flex-start; justify-content: center; }
#photoViewImg { max-width: 100%; max-height: 100%; margin: auto; object-fit: contain; cursor: zoom-in; }
#photoViewImg.full { max-width: none; max-height: none; width: auto; margin: 0; cursor: zoom-out; }
#photoViewClose { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 10px; z-index: 2; width: 44px; height: 44px; border: none; border-radius: 50%; background: rgba(255,255,255,.9); color: #243447; font-size: 20px; }
#photoViewHint { padding: calc(14px + env(safe-area-inset-top)) 60px 8px 12px; color: #c8d2dc; font-size: 12px; }
/* 2026.11.16 Ver.3.4 追加：あり得ないタイムの警告表示（赤） */
#preview.warn, .epreview.warn, #entrySet #preview.warn { color: var(--danger); font-weight: 700; }
.ebtns { display: flex; gap: 6px; margin-top: 6px; }
.ebtns .btn { flex: 1; height: 40px; padding: 0 8px; }
/* 2026.11.16 Ver.3.11 追加：ボタンが4つのとき（先頭の行）は2列×2段に並べる */
.ebtns.four { flex-wrap: wrap; }
.ebtns.four .btn { flex: 1 1 calc(50% - 6px); }
/* 2026.11.16 追加：練習内容の選択（下の入力欄・修正欄で共用） */
.pcontrol { display: flex; gap: 6px; margin-bottom: 6px; }
.pcontrol .psel, .pcontrol .pother {
  flex: 1;
  min-width: 0;
  height: 40px;
  padding: 0 10px;
  background: #F2F9F3;
  border: 1px solid #D2E6D7;
  border-radius: 8px;
}
.pcontrol .pother[hidden] { display: none; }
/* 2026.11.17 Ver.4.2 追加：練習内容が未選択のままタイムを入れたとき、選択欄を赤枠で知らせる */
.pcontrol .psel.need, .pcontrol .pother.need,
#entrySet .pcontrol .psel.need, #entrySet .pcontrol .pother.need { border: 3px solid var(--danger); background: #FFF1F1; }
.editor .pcontrol { margin: 6px 0 0; }

/* ===== 固定フッター（入力） ===== */
#bar {
  flex: none;
  padding: 6px 10px calc(8px + env(safe-area-inset-bottom));
  background: linear-gradient(180deg, #edf2f6 0%, #e8eef3 100%);
  border-top: 1px solid var(--line);
  box-shadow: 0 -2px 8px rgba(35, 55, 75, .045);
}
/* 2026.11.13 変更：日本語入力時はスラッシュボタンを非表示 */
#slashBtn { display: none; }
#preview { min-height: 20px; padding: 0 4px 4px; font-size: 14px; color: var(--gold-text); }
#entryForm { display: flex; gap: 6px; }
/* 2026.11.13 変更：入力欄を複数行（書いている間だけ上下に広がる）に変更 */
#entryForm { align-items: flex-end; }
#entry {
  flex: 1;
  min-width: 0;
  height: 46px;
  padding: 10px;
  background: #F2F9F3;
  border: 1px solid #D2E6D7;
  border-radius: 8px;
  font-size: 18px;
  line-height: 24px;
  resize: none;
  overflow-y: auto;
}
#bar .btn { height: 46px; padding: 0 12px; }

/* 2026.11.16 Ver.3.1 変更：独自の数字キーパッドを廃止（通常キーボードのみ） */
/* 2026.11.16 Ver.3.2 追加：練習内容＋タイム入力を1セットの枠で強調 */
/* 2026.11.16 Ver.3.3 変更：1セットの枠をブラウン系の配色に変更 */
#entrySet { padding: 8px 8px 8px; background: #F6ECE0; border: 2px solid #8B5E3C; border-radius: 12px; box-shadow: 0 2px 8px rgba(107, 66, 38, .20); }
#entrySetHead { display: flex; align-items: center; gap: 6px; margin: 0 2px 6px; font-size: 14px; font-weight: 700; color: #6B4226; }
#entrySetHead .step { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #8B5E3C; color: #fff; font-size: 13px; }
#entrySetHead .arrow { color: #8B5E3C; font-size: 12px; }
#entrySetHead .setnote { margin-left: auto; font-size: 11px; font-weight: 400; color: #8a7360; }
/* 2026.11.16 Ver.4.0 追加：狭い画面では見出しの補足を隠し、見出しが折り返さないようにする */
#entrySetHead { white-space: nowrap; }
@media (max-width: 430px) { #entrySetHead .setnote { display: none; } }
#entrySet .pcontrol .psel, #entrySet .pcontrol .pother { border-color: #A97C50; background: #FFFBF6; font-weight: 600; color: #4A2F1B; }
#entrySet #entry { background: #FFFBF6; border-color: #C9A67F; }
#entrySet #entryForm .btn:not(.sub) { background: #8B5E3C; }
#entrySet #entryForm .btn:not(.sub):hover { background: #6B4226; }
#entrySet #preview { color: #6B4226; }

/* ===== 新規ページ入力・設定修正 ===== */
#overlay {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(28, 36, 48, 0.55);
  overflow-y: auto;
  padding: calc(16px + env(safe-area-inset-top)) 12px 24px;
}
#overlay.open { display: block; }
/* 2026.11.16 Ver.3.15 追加：キーボードが出ている間は、フォームの下に余白を足して、気温などの欄をキーボードより上までスクロールできるようにする */
#overlay.kb { padding-bottom: 60vh; }
#newForm { max-width: 480px; margin: 0 auto; padding: 16px; background: #EAF7ED; border: 1px solid #D2E6D7; border-radius: 12px; }
#newForm h2 { margin: 0 0 12px; font-size: 18px; }
#newForm label, #newForm .lab { display: block; margin-top: 12px; font-size: 14px; color: var(--sub); }
#newForm input, #newForm select {
  display: block;
  width: 100%;
  height: 44px;
  margin-top: 4px;
  padding: 0 10px;
  background: #F5FBF6;
  border: 1px solid #D2E6D7;
  border-radius: 8px;
}
/* 2026.11.13 変更：日付欄が右にはみ出る問題の修正（iPhoneのSafari対策） */
#newForm input, #newForm select { min-width: 0; max-width: 100%; }
#newForm input[type="date"] { text-align: left; }
@media (pointer: coarse) {
  #newForm input[type="date"] {
    -webkit-appearance: none;
    appearance: none;
    line-height: 44px;
  }
  #newForm input[type="date"]::-webkit-date-and-time-value { text-align: left; }
}
/* 2026.11.13 Ver.2.5：入力・選択欄の淡いグリーンを統一 */
#newForm input:required { border: 3px solid var(--accent); }

</head>
<body>

<script>
// 2026.11.16
(function () {
  'use strict';

  var KEY = 'motoGymkhanaLog.v1';
  // 2026.11.16 追加：旧形式からの変換前データを残すバックアップ用キー
  var BACKUP_KEY = 'motoGymkhanaLog.v1.backupBeforeV3';
  // 2026.11.16 追加：保存データの形式番号（2 = Ver.3.0 の「日付×場所」形式）
  var SCHEMA = 2;
  // 2026.11.13 変更：場所にも「その他」を追加（選ぶと入力窓が空になり、手入力できる）
  var PLACES = ['キョウセイ２輪', 'キョウセイ４輪', 'PPS', 'レインボー', 'その他'];
  // 2026.11.16 変更：練習内容の基本の選択肢。「その他」は別に末尾へ付ける（手入力した内容は次回から一覧に残る）
  var PRACTICES = ['8の字GP', '回転弁当', '牛丼弁当', 'アタックコース'];
  var OTHER = 'その他';
  // 2026.11.17 Ver.4.2 追加：練習内容が未選択のときのメッセージ（下の入力欄・修正欄・挿入欄で共用）
  var NEED_PRACTICE_MSG = '練習を選んでください（「▼ 何の練習？」から）';
  var WEATHERS = ['晴れ', '曇り', '雨'];
  var WD = ['日', '月', '火', '水', '木', '金', '土'];

  var $ = function (id) { return document.getElementById(id); };
  var pageSel = $('pageSel'), main = $('main'), listEl = $('list');
  var entry = $('entry'), preview = $('preview');

  // 2026.11.13 変更：修正中の行（{id, mode:'edit'|'insert'}）
  var editing = null;
  // 2026.11.13 変更：設定修正中のページID（null なら新規作成）
  var formEditId = null;
  // 2026.11.16 追加：旧形式から変換した場合に、起動後にお知らせを出す
  var migratedNotice = false;

  // ---------- 2026.11.16 追加：旧形式（Ver.2.5以前）→ 新形式（Ver.3.0）への変換 ----------
  // ・同じ日付＋同じ場所のページを1つに統合（天気・気温は最初のページの値を残す）
  // ・旧ページの「練習内容」を、そのページ内の各タイムに付ける（メモは練習内容なし）
  // ・統合後の並びは、旧ページの作成順に、各ページ内の順番をそのまま保つ
  function migrateData(s) {
    if (!s || !Array.isArray(s.pages)) return s;
    if (s.schema === SCHEMA) return s;
    var order = s.pages.filter(function (p) { return p && typeof p === 'object'; }).sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return (a.created || 0) - (b.created || 0);
    });
    var groups = {};
    var merged = [];
    var idMap = {};
    order.forEach(function (p) {
      var place = placeText(p);
      var key = p.date + '|' + place;
      var base = groups[key];
      if (!base) {
        base = {
          id: p.id,
          created: p.created,
          updatedAt: p.updatedAt || null,
          date: p.date,
          place: place,
          placeOther: '',
          weather: p.weather,
          temp: p.temp,
          entries: []
        };
        groups[key] = base;
        merged.push(base);
      }
      idMap[p.id] = base.id;
      (Array.isArray(p.entries) ? p.entries : []).forEach(function (e) {
        if (!e || typeof e !== 'object') return;
        if (e.type === 'time') e.practice = e.practice || p.practice || '';
        else e.practice = '';
        base.entries.push(e);
      });
    });
    s.pages = merged;
    if (s.current && idMap[s.current]) s.current = idMap[s.current];
    if (typeof s.lastPractice !== 'string') s.lastPractice = '';
    s.schema = SCHEMA;
    return s;
  }

  // ---------- 保存・読込 ----------
  // 2026.11.16 変更：旧形式なら、変換前のデータをバックアップしてから新形式に変換する
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { /* 読めない場合は空で開始 */ }
    try {
      var s = JSON.parse(raw);
      if (s && Array.isArray(s.pages)) {
        if (!s.current) s.current = null;
        if (!s.selectedDate) s.selectedDate = '';
        if (s.schema !== SCHEMA) {
          try {
            if (!localStorage.getItem(BACKUP_KEY)) localStorage.setItem(BACKUP_KEY, raw);
          } catch (e2) { /* バックアップできなくても変換は続ける */ }
          migrateData(s);
          try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e3) { /* 次回の保存時に再度書き込む */ }
          migratedNotice = true;
        }
        if (typeof s.lastPractice !== 'string') s.lastPractice = '';
        return s;
      }
    } catch (e) { /* 読めない場合は空で開始 */ }
    return { pages: [], current: null, selectedDate: '', lastPractice: '', schema: SCHEMA };
  }
  var state = load();

  function save() {
    try {
      state.selectedDate = selectedDate;
      state.schema = SCHEMA;
      localStorage.setItem(KEY, JSON.stringify(state));
    } catch (e) {
      toast('保存に失敗しました（容量不足など）');
    }
  }

  // ---------- 共通 ----------
  function pad2(n) { return (n < 10 ? '0' : '') + n; }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
  }
  function wdOf(s) {
    var p = s.split('-');
    return WD[new Date(+p[0], +p[1] - 1, +p[2]).getDay()];
  }
  function formatDate(s) {
    var p = s.split('-');
    return p[0] + '年' + (+p[1]) + '月' + (+p[2]) + '日（' + wdOf(s) + '）';
  }
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  var toastTimer = null;
  function toast(msg) {
    var t = $('toast');
    // 2026.11.17 Ver.4.2 追加：キーボードが出ている間は、その高さの分だけ上に表示する（iPhoneでキーボードの裏に隠れて見えなくなるのを防ぐ）
    try {
      var vv = window.visualViewport;
      var kb = vv ? Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop)) : 0;
      t.style.bottom = kb > 0 ? (kb + 90) + 'px' : '';
    } catch (err) { t.style.bottom = ''; }
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2200);
  }

  // ---------- 2026.11.16 Ver.4.0 追加：写真 ----------
  // 写真本体は容量の大きい IndexedDB に保存し、記録（type:'photo'）には photoId だけを持たせる。
  // 取り込み時に長辺1280px・JPEG画質0.7に縮小する（文字が読める程度）。
  var PHOTO_DB = 'motoGymkhanaLog.photos';
  var PHOTO_STORE = 'photos';
  var PHOTO_MAX = 1280;
  var PHOTO_QUALITY = 0.7;
  var photoDbPromise = null;
  var photoCache = {};
  function photoDb() {
    if (photoDbPromise) return photoDbPromise;
    photoDbPromise = new Promise(function (resolve, reject) {
      try {
        if (!window.indexedDB) { reject(new Error('この環境では写真を保存できません')); return; }
        var rq = indexedDB.open(PHOTO_DB, 1);
        rq.onupgradeneeded = function () { rq.result.createObjectStore(PHOTO_STORE); };
        rq.onsuccess = function () { resolve(rq.result); };
        rq.onerror = function () { reject(rq.error || new Error('写真の保存領域を開けません')); };
      } catch (e) { reject(e); }
    });
    return photoDbPromise;
  }
  function photoTx(mode, fn) {
    return photoDb().then(function (db) {
      return new Promise(function (resolve, reject) {
        var tx = db.transaction(PHOTO_STORE, mode);
        var rq = fn(tx.objectStore(PHOTO_STORE));
        tx.oncomplete = function () { resolve(rq ? rq.result : undefined); };
        tx.onerror = function () { reject(tx.error); };
        tx.onabort = function () { reject(tx.error || new Error('保存が中断されました')); };
      });
    });
  }
  function putPhoto(id, data) { return photoTx('readwrite', function (st) { return st.put(data, id); }); }
  function getPhoto(id) { return photoTx('readonly', function (st) { return st.get(id); }); }
  function delPhoto(id) { return photoTx('readwrite', function (st) { return st.delete(id); }); }

  // 他の記録がまだ同じ写真を使っているか（別IDで残した記録が同じ写真を指す場合があるため）
  function photoStillUsed(photoId, exceptEntryId) {
    for (var i = 0; i < state.pages.length; i++) {
      var list = state.pages[i].entries || [];
      for (var j = 0; j < list.length; j++) {
        if (list[j].type === 'photo' && list[j].photoId === photoId && list[j].id !== exceptEntryId) return true;
      }
    }
    return false;
  }
  function releasePhoto(e) {
    if (!e || e.type !== 'photo' || !e.photoId) return;
    if (photoStillUsed(e.photoId, e.id)) return;
    delete photoCache[e.photoId];
    delPhoto(e.photoId).catch(function () { /* 消せなくても記録の削除は続ける */ });
  }

  function shrinkImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        try {
          var w = img.naturalWidth, h = img.naturalHeight;
          var sc = Math.min(1, PHOTO_MAX / Math.max(w, h));
          var cw = Math.max(1, Math.round(w * sc)), ch = Math.max(1, Math.round(h * sc));
          var c = document.createElement('canvas');
          c.width = cw; c.height = ch;
          var g = c.getContext('2d');
          g.fillStyle = '#ffffff';
          g.fillRect(0, 0, cw, ch);
          g.drawImage(img, 0, 0, cw, ch);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', PHOTO_QUALITY));
        } catch (err) { URL.revokeObjectURL(url); reject(err); }
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('画像を読み込めません')); };
      img.src = url;
    });
  }

  // 写真を1枚選ぶ（スマホではカメラ撮影／ライブラリから選択）。選んだら cb(記録) を呼ぶ
  var photoCb = null;
  function pickPhoto(cb) {
    photoCb = cb;
    $('photoFile').value = '';
    $('photoFile').click();
  }
  $('photoFile').addEventListener('change', function () {
    var f = this.files && this.files[0];
    var cb = photoCb;
    photoCb = null;
    if (!f || !cb) return;
    toast('写真を取り込み中…');
    shrinkImage(f).then(function (data) {
      var pid = 'ph' + uid();
      return putPhoto(pid, data).then(function () {
        photoCache[pid] = data;
        toast('写真を追加しました');
        cb({ id: uid(), type: 'photo', photoId: pid, text: '写真', practice: '', createdAt: Date.now(), updatedAt: null });
      });
    }).catch(function (err) {
      toast('写真を保存できませんでした：' + ((err && err.message) || ''));
    });
  });

  function loadPhotoInto(img, photoId, holder) {
    function missing() {
      var m = el('div', 'pmiss', '写真が見つかりません（この端末に保存されていません）');
      if (img.parentNode) img.parentNode.replaceChild(m, img);
    }
    if (photoCache[photoId]) { img.src = photoCache[photoId]; return; }
    getPhoto(photoId).then(function (data) {
      if (data) { photoCache[photoId] = data; img.src = data; }
      else missing();
    }).catch(missing);
  }

  // 拡大表示（タップで 原寸／全体 の切り替え）
  function openPhotoView(src) {
    var v = $('photoView');
    $('photoViewImg').classList.remove('full');
    $('photoViewImg').src = src;
    v.hidden = false;
  }
  function closePhotoView() {
    $('photoView').hidden = true;
    $('photoViewImg').removeAttribute('src');
  }
  $('photoViewImg').addEventListener('click', function () { this.classList.toggle('full'); });
  $('photoViewClose').addEventListener('click', closePhotoView);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && !$('photoView').hidden) closePhotoView();
  });
  // 下の入力欄のボタンも同じ（欄の高さが縮んでボタンがずれ、押せなくなるのを防ぐ）
  $('entryForm').addEventListener('mousedown', function (ev) {
    if (ev.target.closest && ev.target.closest('button')) ev.preventDefault();
  });
  // 下の入力欄の 📷：記録の流れの最後に追加する（キーボードは出さない）
  $('photoBtn').addEventListener('click', function () {
    pickPhoto(function (pe) {
      var p = currentPage();
      if (!p) return;
      p.entries.push(pe);
      save();
      editing = null;
      renderList();
      main.scrollTop = main.scrollHeight;
      setTimeout(function () { main.scrollTop = main.scrollHeight; }, 300);
      setTimeout(function () { main.scrollTop = main.scrollHeight; }, 900);
    });
  });

  function sortedPages() {
    return state.pages.slice().sort(function (a, b) {
      if (a.date !== b.date) return a.date < b.date ? -1 : 1;
      return a.created - b.created;
    });
  }
  function currentPage() {
    for (var i = 0; i < state.pages.length; i++) {
      if (state.pages[i].id === state.current) return state.pages[i];
    }
    return null;
  }
  // 2026.11.13 追加：現在表示する日付。旧データでは選択中ページの日付を引き継ぐ。
  var selectedDate = state.selectedDate || (currentPage() ? currentPage().date : (sortedPages().length ? sortedPages()[sortedPages().length - 1].date : todayStr()));
  state.selectedDate = selectedDate;

  function timeText(value) {
    if (!value) return '';
    var d = new Date(value);
    if (isNaN(d.getTime())) return '';
    return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
  }

  function entryStamp(e) {
    var value = e.updatedAt || e.createdAt;
    var text = timeText(value);
    if (!text) return '';
    return (e.updatedAt ? '更新 ' : '') + text;
  }
  // 以前の保存データ（その他＋手入力）にも対応
  function placeText(p) {
    return (p.place === 'その他' && p.placeOther) ? p.placeOther : p.place;
  }
  function indexOfEntry(p, id) {
    for (var i = 0; i < p.entries.length; i++) {
      if (p.entries[i].id === id) return i;
    }
    return -1;
  }
  // 2026.11.16 追加：同じ日付・同じ場所のページを探す（exceptId のページは除く）
  function findPageByDatePlace(date, place, exceptId) {
    for (var i = 0; i < state.pages.length; i++) {
      var p = state.pages[i];
      if (p.id !== exceptId && p.date === date && placeText(p) === place) return p;
    }
    return null;
  }

  // 2026.11.13 変更：ダブルクリック（PC）／ダブルタップ（スマホ）
  function onDouble(target, fn) {
    var last = 0;
    target.addEventListener('dblclick', function (ev) {
      ev.preventDefault();
      fn();
    });
    target.addEventListener('touchend', function (ev) {
      var now = Date.now();
      if (now - last < 350) {
        ev.preventDefault();
        last = 0;
        fn();
      } else {
        last = now;
      }
    });
  }

  // ---------- 2026.11.16 追加：練習内容の選択（下の入力欄と修正欄で共用） ----------
  // 基本の選択肢 ＋ これまでに手入力した練習内容 ＋「その他」
  function practiceList() {
    var list = PRACTICES.slice();
    state.pages.forEach(function (p) {
      (Array.isArray(p.entries) ? p.entries : []).forEach(function (e) {
        if (e && e.practice && e.practice !== OTHER && list.indexOf(e.practice) < 0) list.push(e.practice);
      });
    });
    return list;
  }
  function buildPracticeControl(initial) {
    var root = el('div', 'pcontrol');
    var sel = el('select', 'psel');
    sel.setAttribute('aria-label', '何の練習のタイムか');
    var other = el('input', 'pother');
    other.type = 'text';
    other.placeholder = '練習内容を入力';
    other.hidden = true;
    root.appendChild(sel);
    root.appendChild(other);
    function fill(value) {
      var v = value || '';
      sel.textContent = '';
      var head = el('option', '', '▼ 何の練習？');
      head.value = '';
      sel.appendChild(head);
      practiceList().forEach(function (t) {
        var o = el('option', '', t);
        o.value = t;
        sel.appendChild(o);
      });
      var oo = el('option', '', OTHER);
      oo.value = OTHER;
      sel.appendChild(oo);
      sel.value = v;
      if (sel.value !== v) sel.value = '';
      other.hidden = sel.value !== OTHER;
      other.value = '';
    }
    // 2026.11.17 Ver.4.2 追加：未選択の赤枠を消す
    function clearNeed() {
      sel.classList.remove('need');
      other.classList.remove('need');
    }
    sel.addEventListener('change', function () {
      other.hidden = sel.value !== OTHER;
      if (!other.hidden) {
        other.value = '';
        other.focus();
      }
      // 2026.11.17 Ver.4.2 追加：選び直したら赤枠を消し、呼び出し元（入力欄のメッセージ）にも知らせる
      clearNeed();
      if (typeof api.onChange === 'function') api.onChange();
    });
    // 2026.11.17 Ver.4.2 追加：「その他」に文字を入れたら赤枠を消す
    other.addEventListener('input', function () {
      clearNeed();
      if (typeof api.onChange === 'function') api.onChange();
    });
    fill(initial);
    var api = {
      root: root,
      get: function () {
        return sel.value === OTHER ? other.value.trim() : sel.value;
      },
      set: function (v) { fill(v); clearNeed(); },
      setDisabled: function (d) { sel.disabled = d; other.disabled = d; },
      // 2026.11.17 Ver.4.2 追加：練習内容が未選択のとき、赤枠で知らせる（「その他」を選んで未入力なら入力欄の方を赤枠に）
      alertNeed: function () {
        clearNeed();
        if (sel.value === OTHER) other.classList.add('need');
        else sel.classList.add('need');
      },
      onChange: null
    };
    return api;
  }

  // ---------- タイム入力ルール ----------
  // 全角数字・全角スラッシュのみで構成されている場合は半角に直す
  function norm(v) {
    if (/^[0-9０-９\/／]*$/.test(v)) {
      return v.replace(/[０-９]/g, function (c) {
        return String.fromCharCode(c.charCodeAt(0) - 0xFEE0);
      }).replace(/／/g, '/');
    }
    return v;
  }
  // 数字とスラッシュだけの入力中に、秒は59まで・秒以下は3桁までに制限
  // 2026.11.16 Ver.3.4 変更：入れられない理由をメッセージで返す（問題なければ空文字）
  function liveCheck(v) {
    if (!/^[0-9\/]*$/.test(v) || v.indexOf('/') < 0) return '';
    var ex = '（例：1/02/333）';
    var p = v.split('/');
    if (p.length > 3) return '「／」は2つまでです' + ex;
    // 2026.11.16 Ver.3.5 変更：先頭の分が空（/50/222）は 0分として許可
    if (p[0].length > 2) return '分は2桁までです' + ex;
    if (p.length >= 2) {
      if (p[1].length > 2) return '秒は2桁までです' + ex;
      if (p[1] !== '' && Number(p[1]) > 59) return '秒は59までです' + ex;
    }
    if (p.length === 3) {
      if (p[1] === '') return '先に「秒」の数字を入れてください' + ex;
      if (p[2].length > 3) return '秒以下は3桁までです' + ex;
    }
    return '';
  }
  // 2026.11.16 Ver.3.4 追加：登録時のチェック。数字と「／」だけで、タイムの形にならない入力（貼り付け等）をはじく
  function timeError(raw) {
    var v = norm(raw);
    if (!/^[0-9\/]+$/.test(v) || v.indexOf('/') < 0) return '';
    if (parseTime(v)) return '';
    var m = /^(\d{0,2})\/(\d{1,2})\/(\d{1,3})$/.exec(v);
    if (m && Number(m[2]) > 59) return '秒は59までです（例：1/02/333）';
    return 'タイムの形が違います（例：1/02/333）';
  }
  // 1/02/333 → 1分02秒333（秒以下が3桁未満なら右を0で埋める：36 → 360）
  function parseTime(v) {
    // 2026.11.16 Ver.3.5 変更：分を省略した「/50/222」は 0分50秒222 として扱う（0/50/222 と同じ）
    var m = /^(\d{0,2})\/(\d{1,2})\/(\d{1,3})$/.exec(v);
    if (!m) return null;
    var min = m[1] === '' ? 0 : Number(m[1]);
    var sec = Number(m[2]);
    if (sec > 59) return null;
    var ms3 = m[3];
    while (ms3.length < 3) ms3 += '0';
    return {
      ms: min * 60000 + sec * 1000 + Number(ms3),
      text: min + '分' + pad2(sec) + '秒' + ms3
    };
  }
  // 2026.11.13 変更：入力文字から記録（タイム or メモ）を作る
  // 2026.11.16 変更：practice（練習内容）の欄を追加。メモは常に空
  function buildEntry(raw) {
    var t = parseTime(norm(raw));
    if (t) return { type: 'time', ms: t.ms, text: t.text, practice: '' };
    return { type: 'memo', text: raw, practice: '' };
  }
  // 2026.11.13 変更：記録を修正用の入力文字（1/02/333）に戻す
  function editText(e) {
    if (e.type !== 'time') return e.text;
    var min = Math.floor(e.ms / 60000);
    var sec = Math.floor((e.ms % 60000) / 1000);
    var ms = e.ms % 1000;
    return min + '/' + pad2(sec) + '/' + ('00' + ms).slice(-3);
  }
  // 2026.11.13 変更：入力欄にタイムのルールを付ける（下の入力欄と修正欄で共用）
  function attachRules(inp, pv) {
    var prev = inp.value;
    // 2026.11.13 変更：書いている間だけ入力欄を上下に広げる（画面の約35%まで）
    function grow() {
      if (document.activeElement !== inp) return;
      var vh = window.visualViewport ? window.visualViewport.height : window.innerHeight;
      inp.style.height = 'auto';
      var h = Math.min(inp.scrollHeight + 4, Math.round(vh * 0.35));
      inp.style.height = Math.max(h, 46) + 'px';
    }
    inp.addEventListener('focus', grow);
    inp.addEventListener('blur', function () {
      inp.style.height = '';
      inp.scrollTop = 0;
    });
    // 2026.11.13 変更：Enterで改行、登録ボタンで保存
    inp.addEventListener('keydown', function (e) {
      // 日本語IMEの変換中は標準動作に任せる
      if (e.isComposing || e.keyCode === 229) return;

      // Enterは改行として使用する
      // 保存は登録・保存ボタンで行う
    });

    function show() {
      var t = parseTime(norm(inp.value));
      pv.textContent = t ? '→ ' + t.text : '';
      pv.classList.remove('warn');
      grow();
    }
    // 2026.11.16 Ver.3.4 追加：あり得ないタイムのメッセージ表示
    function warn(msg) {
      pv.textContent = '⚠ ' + msg;
      pv.classList.add('warn');
    }
    // 2026.11.13 変更：日本語IME入力中のカーソル・変換状態を保護
    function apply() {
      var v = norm(inp.value);
      var why = liveCheck(v);

      if (why) {
        inp.value = prev;
        show();
        warn(why);
      } else {
        // 値が変わった場合だけ再代入する
        if (inp.value !== v) {
          inp.value = v;
        }
        prev = v;
        show();
      }
    }
    inp.addEventListener('input', function (e) {
      if (e.isComposing) return;
      apply();
    });
    inp.addEventListener('compositionend', apply);
    var api = {
      show: show,
      warn: warn,
      reset: function () { prev = ''; inp.value = ''; pv.textContent = ''; grow(); },
      // 2026.11.13 変更：キーパッド用（末尾に1文字追加／1文字消す）
      append: function (ch) {
        var v = inp.value + ch;
        var why = liveCheck(v);
        if (!why) { inp.value = v; prev = v; show(); }
        else { warn(why); }
      },
      backspace: function () {
        var v = inp.value.slice(0, -1);
        inp.value = v;
        prev = v;
        show();
      },
      insertSlash: function () {
        api.append('/');
        inp.focus();
      }
    };
    inp._rules = api;
    return api;
  }

  // 2026.11.16 Ver.3.1 変更：独自の数字キーパッドと入力方式の切替を廃止（通常キーボードのみ）

  // 2026.11.16 追加：下の入力欄の練習内容（前回の選択を state.lastPractice から引き継ぐ）
  var barPractice = buildPracticeControl(state.lastPractice);
  $('practiceHost').appendChild(barPractice.root);
  // 2026.11.17 Ver.4.2 追加：練習を選び直したら、入力欄の上の赤いメッセージを消す（タイムの確認表示に戻す）
  barPractice.onChange = function () { if (entry._rules) entry._rules.show(); };
  function syncBarPractice() { barPractice.set(state.lastPractice); }

  // ---------- 描画 ----------
  // 2026.11.16 変更：選んだ日付のページ（＝場所）を一覧にする
  function renderSelect() {
    var pages = sortedPages().filter(function (p) { return p.date === selectedDate; });

  // 2026.11.16 変更：大見出しは場所、チップは天気・気温
  function renderInfo() {

    empty.hidden = !!p;

  // 2026.11.13 変更：修正・挿入用のエディタ行
  // 2026.11.16 変更：練習内容の選択を追加。onClick(入力値, 練習内容)
  // buttons: [{label, cls, submit, onClick(入力値, 練習内容)}]
  function buildEditor(initial, placeholder, buttons, practiceInit) {
    var form = el('form', 'editor');
    form.autocomplete = 'off';
    var row = el('div', 'erow');
    var slash = el('button', 'btn sub', '／');
    slash.type = 'button';
    var inp = el('textarea');
    inp.rows = 1;
    inp.value = initial;
    inp.placeholder = placeholder;
    var pv = el('div', 'epreview');
    var rules = attachRules(inp, pv);
    var pc = buildPracticeControl(practiceInit || '');
    // 2026.11.17 Ver.4.2 追加：ボタンの処理へ渡す、メッセージ表示用の道具（入力欄のすぐ下に赤字／練習の選択欄を赤枠）
    var ui = {
      warn: function (msg) { rules.warn(msg); },
      needPractice: function () {
        rules.warn(NEED_PRACTICE_MSG);
        pc.alertNeed();
      }
    };
    pc.onChange = function () { rules.show(); };
    rules.show();
    slash.addEventListener('click', rules.insertSlash);
    row.appendChild(slash);
    row.appendChild(inp);
    var btns = el('div', 'ebtns' + (buttons.length > 3 ? ' four' : ''));
    buttons.forEach(function (b) {
      var bt = el('button', 'btn ' + (b.cls || '') + (b.submit ? ' primary' : ''), b.label);
      bt.type = b.submit ? 'submit' : 'button';
      if (!b.submit) {
        bt.addEventListener('click', function () { b.onClick(inp.value.trim(), pc.get(), ui); });
      }
      btns.appendChild(bt);
    });
    form.addEventListener('submit', function (ev) {
      ev.preventDefault();
      var ok = buttons.filter(function (b) { return b.submit; })[0];
      if (ok) ok.onClick(inp.value.trim(), pc.get(), ui);
    });
    // 2026.11.16 Ver.4.0 追加：ボタンを押した瞬間に入力欄のフォーカスが外れて欄の高さが縮み、ボタンの位置がずれて押せなくなるのを防ぐ
    form.addEventListener('mousedown', function (ev) {
      if (ev.target.closest && ev.target.closest('button')) ev.preventDefault();
    });
    form.appendChild(row);
    form.appendChild(pv);
    form.appendChild(pc.root);
    form.appendChild(btns);
    return form;
  }

  // 2026.11.16 変更：練習内容（practice）を受け取り、タイムなら必須にする
  // 2026.11.17 Ver.4.2 変更：ui（メッセージ表示用）を受け取り、入力欄のすぐ下にも赤字で理由を出す
  function saveEdit(p, e, raw, practice, ui) {
    if (!raw) {
      if (ui) ui.warn('空欄は保存できません（削除は ✕ で）');
      toast('空欄は保存できません（削除は ✕ で）');
      return false;
    }
    var terr = timeError(raw);
    if (terr) {
      if (ui) ui.warn(terr);
      toast(terr);
      return false;
    }
    var idx = indexOfEntry(p, e.id);
    if (idx < 0) return false;
    var ne = buildEntry(raw);
    if (ne.type === 'time') {
      if (!practice) {
        if (ui) ui.needPractice();
        toast(NEED_PRACTICE_MSG);
        return false;
      }
      ne.practice = practice;
    }
    ne.id = e.id;
    ne.createdAt = e.createdAt || null;
    ne.updatedAt = Date.now();
    p.entries[idx] = ne;
    save();
    return true;
  }

  function buildEditRow(p, e) {
    var orig = editText(e);
    var origPractice = e.practice || '';
    var buttons = [
      {
        label: '保存', submit: true,
        onClick: function (raw, practice, ui) {
          if (saveEdit(p, e, raw, practice, ui)) { editing = null; renderList(); }
        }
      },
      {
        label: 'この下に挿入', cls: 'sub',
        onClick: function (raw, practice, ui) {
          if ((raw !== orig || practice !== origPractice) && !saveEdit(p, e, raw, practice, ui)) return;
          editing = { id: e.id, mode: 'insert' };
          renderList();
        }
      },
      {
        label: '取消', cls: 'sub',
        onClick: function () { editing = null; renderList(); }
      }
    ];
    // 2026.11.16 Ver.3.11 追加：一番上の行だけ「この上に挿入」も出す（それ以外の行は、上の行の「この下に挿入」で足りる）
    if (indexOfEntry(p, e.id) === 0) {
      buttons.splice(1, 0, {
        label: 'この上に挿入', cls: 'sub',
        onClick: function (raw, practice, ui) {
          if ((raw !== orig || practice !== origPractice) && !saveEdit(p, e, raw, practice, ui)) return;
          editing = { id: e.id, mode: 'insertAbove' };
          renderList();
        }
      });
    }
    return buildEditor(orig, '1/02/333 またはメモ', buttons, origPractice);
  }

  // 2026.11.16 変更：挿入時も練習内容を付ける（前回の選択を引き継ぐ）
  // 2026.11.16 Ver.3.11 変更：above=true のときは、その行の上（先頭）に挿入する
  function buildInsertRow(p, e, above) {
    var insForm = buildEditor('', (above ? '先頭に挿入：' : '挿入：') + '1/02/333 またはメモ', [
      {
        label: '挿入', submit: true,

            if (ui) ui.warn(terr);
            toast(terr);

          }
          var idx = indexOfEntry(p, e.id);
          if (idx < 0) return;

          if (ne.type === 'time') {

          ne.updatedAt = null;
          // 2026.11.16 Ver.3.13 変更：挿入前のスクロール位置を保持し、挿入内容をその場で確認できるようにする
          var keepScrollTop = main.scrollTop;
          p.entries.splice(above ? idx : idx + 1, 0, ne);

          editing = null;

    ].concat((!above && e.type === 'photo' && indexOfEntry(p, e.id) === 0) ? [{

      label: '写真の上に挿入', cls: 'sub',

  // 2026.11.16 変更：タイム行に練習内容のタグを表示
  function buildRow(p, e, isBest) {

  // 20261116 / 2026-11-16 / 2026/11/16 / 2026年11月16日（全角も可）を 2026-11-16 に直す。日付として成り立たなければ空文字
  function parseDateInput(raw) {
    var v = String(raw || '').trim()
      .replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
      .replace(/[／]/g, '/')
      .replace(/[－−ー]/g, '-');
    var m = /^(\d{4})[-\/.年](\d{1,2})[-\/.月](\d{1,2})日?$/.exec(v) || /^(\d{4})(\d{2})(\d{2})$/.exec(v);
    if (!m) return '';
    var y = Number(m[1]), mo = Number(m[2]), d = Number(m[3]);
    var dt = new Date(y, mo - 1, d);
    if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return '';
    return y + '-' + pad2(mo) + '-' + pad2(d);
  }

      pv.classList.add('warn');
    } else {
      pv.textContent = '';
      pv.classList.remove('warn');
    }
  }

  // ノートID・記録IDで同一データを判定し、同じJSONの再読み込みによる重複を防ぐ。
  function entryContentKey(e) {
    return [e.type || '', e.text || '', (e.ms === undefined ? '' : e.ms)].join('|');
  }

  function mergeImportedData(incoming) {
    var addedPages = 0;
    var addedEntries = 0;
    var updatedEntries = 0;
    var duplicatedConflicts = 0;

    incoming.pages.forEach(function (sourcePage) {
      if (!sourcePage || typeof sourcePage !== 'object') return;
      var importedPage = JSON.parse(JSON.stringify(sourcePage));
      if (!importedPage.id) importedPage.id = uid();
      if (!Array.isArray(importedPage.entries)) importedPage.entries = [];
      if (!importedPage.created) importedPage.created = Date.now();

      var localPage = null;
      for (var i = 0; i < state.pages.length; i++) {
        if (state.pages[i].id === importedPage.id) {
          localPage = state.pages[i];
          break;
        }
      }
      // 2026.11.16 追加：IDが違っても、日付＋場所が同じなら同じページとして統合する
      if (!localPage) {
        localPage = findPageByDatePlace(importedPage.date, placeText(importedPage), null);
      }

      if (!localPage) {
        var usedEntryIds = {};
        importedPage.entries.forEach(function (entryItem) {
          if (!entryItem || typeof entryItem !== 'object') return;
          if (!entryItem.id || usedEntryIds[entryItem.id]) entryItem.id = uid();
          usedEntryIds[entryItem.id] = true;
        });
        state.pages.push(importedPage);
        addedPages++;
        addedEntries += importedPage.entries.length;
        return;
      }

      if (!Array.isArray(localPage.entries)) localPage.entries = [];
      importedPage.entries.forEach(function (incomingEntry) {
        if (!incomingEntry || typeof incomingEntry !== 'object') return;
        if (!incomingEntry.id) incomingEntry.id = uid();
        var existing = null;
        for (var j = 0; j < localPage.entries.length; j++) {
          if (localPage.entries[j].id === incomingEntry.id) {
            existing = localPage.entries[j];
            break;
          }
        }
        if (!existing) {
          localPage.entries.push(incomingEntry);
          addedEntries++;
          return;
        }
        if (entryContentKey(existing) === entryContentKey(incomingEntry)) {
          var oldStamp = Number(existing.updatedAt || existing.createdAt || 0);
          var newStamp = Number(incomingEntry.updatedAt || incomingEntry.createdAt || 0);
          if (newStamp > oldStamp) {
            var replaceIndex = localPage.entries.indexOf(existing);
            localPage.entries[replaceIndex] = incomingEntry;
            updatedEntries++;
          }
          return;
        }
        // 同じIDなのに内容が異なる場合は、どちらも残すため別IDで追加する。
        var conflictCopy = JSON.parse(JSON.stringify(incomingEntry));
        conflictCopy.id = uid();
        localPage.entries.push(conflictCopy);
        addedEntries++;
        duplicatedConflicts++;
      });

      // ページ設定は既存データを優先する。新しい形式で更新日時が明確に新しい場合だけ更新。
      // 2026.11.16 変更：練習内容（practice）はページ設定から外した
      var localPageTime = Number(localPage.updatedAt || localPage.created || 0);
      var incomingPageTime = Number(importedPage.updatedAt || importedPage.created || 0);
      if (incomingPageTime > localPageTime && importedPage.updatedAt) {
        ['date', 'place', 'placeOther', 'weather', 'temp', 'updatedAt'].forEach(function (key) {
          if (importedPage[key] !== undefined) localPage[key] = importedPage[key];
        });
      }
    });

    return {
      pages: addedPages,
      entries: addedEntries,
      updated: updatedEntries,
      conflicts: duplicatedConflicts
    };
  }

  $('importFile').addEventListener('change', function () {
    var f = $('importFile').files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var imported = JSON.parse(r.result);
        if (!imported || !Array.isArray(imported.pages)) throw new Error('形式が違います');
        if (!confirm('読み込んだノートを現在のデータに追加・統合します。\n既存のノートは削除しません。よろしいですか？')) return;
        // 2026.11.16 追加：旧形式（Ver.2.5以前）のファイルは、読み込み時に新形式へ変換する
        migrateData(imported);
        // 2026.11.16 Ver.4.0 追加：バックアップに入っている写真を、この端末に保存する
        var importedPhotos = (imported.photos && typeof imported.photos === 'object') ? imported.photos : {};
        Object.keys(importedPhotos).forEach(function (pid) {
          var data = importedPhotos[pid];
          if (typeof data !== 'string' || data.indexOf('data:image/') !== 0) return;
          photoCache[pid] = data;
          putPhoto(pid, data).catch(function () { toast('写真の一部を保存できませんでした'); });
        });
        var result = mergeImportedData(imported);
        // 読み込み後は、追加されたノートがあればその日付を表示する。
        if (imported.current) {
          var importedCurrent = null;
          for (var i = 0; i < state.pages.length; i++) {
            if (state.pages[i].id === imported.current) importedCurrent = state.pages[i];
          }
          if (importedCurrent) {
            state.current = importedCurrent.id;
            selectedDate = importedCurrent.date;
          }
        }
        if (!currentPage() || currentPage().date !== selectedDate) {
          var sameDay = sortedPages().filter(function (x) { return x.date === selectedDate; });
          state.current = sameDay.length ? sameDay[sameDay.length - 1].id : null;
        }
        state.selectedDate = selectedDate;
        save();
        renderAll(true);
        toast('読み込みました：ノート' + result.pages + '件・記録' + result.entries + '件を追加');
        if (result.conflicts) {
          setTimeout(function () { toast('同じIDで内容が異なる記録 ' + result.conflicts + '件は、別記録として残しました'); }, 2300);
        }
      } catch (err) {
        toast('読み込めませんでした：' + err.message);
      }
      $('importFile').value = '';
    };
    r.readAsText(f);
  });

  // ---------- 起動 ----------
  if (!selectedDate) selectedDate = todayStr();
  if (currentPage() && currentPage().date !== selectedDate) selectedDate = currentPage().date;
  if (!currentPage()) {
    var initialPages = sortedPages().filter(function (x) { return x.date === selectedDate; });
    state.current = initialPages.length ? initialPages[initialPages.length - 1].id : null;
  }
  state.selectedDate = selectedDate;
  renderAll(true);
  // 2026.11.16 追加：旧形式から変換した場合のお知らせ
  if (migratedNotice) toast('Ver.3.0の形式に変換しました（変換前のデータはバックアップ済み）');
  if (!state.pages.length) openForm(null);
})();
</script>
</body>
</html>
